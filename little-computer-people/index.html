<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Tiny Tenant</title>
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#f6f1e7">
<style>
/* Layout: header with clock and mail, pixel house canvas with speech bubble, talk box, needs panel and action buttons */
:root{
  --paper:#f6f1e7; --panel:#fffdf8; --ink:#2b2622; --muted:#6f655b; --line:#ddd2c2;
  --accent:#d0603a; --good:#4f9d5d; --warn:#d9a13b; --bad:#c9483b;
  --ui:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
  --type:"Courier New",Courier,monospace;
  color-scheme: light;
}
*{box-sizing:border-box}
html,body{margin:0;background:var(--paper);color:var(--ink)}
body{font-family:var(--ui);font-size:16px;-webkit-tap-highlight-color:transparent}
.wrap{max-width:1000px;margin:0 auto;padding-block:16px 28px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));display:grid;gap:12px}
header{display:flex;flex-wrap:wrap;align-items:flex-end;justify-content:space-between;gap:10px 20px}
h1{font-family:var(--type);font-weight:700;font-size:clamp(26px,5vw,38px);line-height:1;margin:0;letter-spacing:-.02em}
h1 span{color:var(--accent)}
.tag{margin:6px 0 0;color:var(--muted);max-width:60ch}
.hud{display:flex;flex-wrap:wrap;align-items:center;gap:6px}
.chip{font-variant-numeric:tabular-nums;background:var(--panel);border:1px solid var(--line);border-radius:6px;padding:5px 10px;font-weight:600;white-space:nowrap}
button{font:inherit;font-weight:600;border:1.5px solid var(--ink);background:var(--panel);color:var(--ink);border-radius:6px;padding:6px 12px;cursor:pointer;touch-action:manipulation}
button:hover{background:#fbeee4}
button:focus-visible,input:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
button:disabled{opacity:.4;cursor:not-allowed;background:var(--panel)}
button.primary{background:var(--accent);border-color:var(--accent);color:#fff}
button.on{background:var(--ink);color:#fff}
#mailBtn b{display:inline-block;min-width:1.4em;margin-left:4px;padding:0 5px;border-radius:9px;background:var(--accent);color:#fff;font-size:13px}
#mailBtn b:empty{display:none}
.stage{position:relative;border:3px solid var(--ink);border-radius:8px;overflow:hidden;background:#cfe6f2;aspect-ratio:400/200;user-select:none;-webkit-user-select:none}
#c{display:block;width:100%;height:100%;image-rendering:pixelated;image-rendering:crisp-edges;cursor:pointer;touch-action:manipulation}
.bubble{position:absolute;transform:translate(-50%,-100%);background:#fff;border:2px solid var(--ink);border-radius:10px;padding:4px 9px;font-size:clamp(12px,1.8vw,15px);font-weight:600;max-width:46%;width:max-content;text-align:center;pointer-events:none;box-shadow:0 2px 0 rgba(0,0,0,.15)}
.bubble::after{content:"";position:absolute;left:50%;bottom:-8px;margin-left:-6px;border:6px solid transparent;border-top-color:var(--ink);border-bottom:0}
.bubble[hidden]{display:none}
.doing{margin:0;color:var(--muted);min-height:1.3em}
.doing b{color:var(--ink)}
form.talk{display:flex;gap:8px}
form.talk input{flex:1;min-width:0;font:inherit;font-size:16px;padding:8px 10px;border:1.5px solid var(--ink);border-radius:6px;background:#fff;color:var(--ink)}
.panels{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1.4fr);gap:12px}
@media (max-width:700px){.panels{grid-template-columns:1fr}}
section{background:var(--panel);border:1px solid var(--line);border-radius:8px;padding:12px 14px}
section h3{margin:0 0 8px;font-size:13px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}
section h3:not(:first-child){margin-top:12px}
.need{display:grid;grid-template-columns:74px 1fr;align-items:center;gap:8px;margin:5px 0;font-size:14px}
.bar{height:10px;border-radius:5px;background:#ece4d6;overflow:hidden}
.bar i{display:block;height:100%;width:50%;background:var(--good);transition:width .3s}
.row{display:flex;flex-wrap:wrap;gap:6px}
.row button{font-size:15px}
.stock{font-size:13px;color:var(--muted);margin:6px 0 0}
.help{font-size:14px;color:var(--muted);margin:0}
.modal{position:fixed;inset:0;display:flex;align-items:center;justify-content:center;padding:16px;background:rgba(246,241,231,.82);z-index:10}
.modal[hidden]{display:none}
.card{background:var(--panel);border:2px solid var(--ink);border-radius:10px;padding:18px 20px;max-width:480px;width:100%;max-height:calc(100vh - 32px);overflow:auto;box-shadow:0 5px 0 rgba(43,38,34,.2)}
.card h2{font-family:var(--type);margin:0 0 8px;font-size:22px}
.card p{margin:0 0 12px;color:var(--muted)}
.card .row{justify-content:flex-end;margin-top:12px}
.letter{font-family:var(--type);white-space:pre-wrap;background:#fff;border:1px solid var(--line);padding:16px;line-height:22px;font-size:15px;color:#222;background-image:repeating-linear-gradient(transparent 0 21px,#eef1f6 21px 22px);background-position:0 16px}
.mail{list-style:none;margin:0;padding:0;display:grid;gap:6px}
.mail button{width:100%;text-align:left;font-weight:400;display:flex;justify-content:space-between;gap:10px}
.mail button.unread{font-weight:700;border-color:var(--accent)}
.mail small{color:var(--muted);white-space:nowrap}
.hand{display:flex;gap:6px;margin:6px 0 12px;min-height:62px;flex-wrap:wrap}
.pc{width:42px;height:60px;border:1.5px solid var(--ink);border-radius:5px;background:#fff;display:flex;flex-direction:column;justify-content:space-between;padding:3px 5px;font-weight:700;font-size:16px}
.pc.red{color:#c0392b}
.pc span:last-child{align-self:flex-end}
.pc.back{background:repeating-linear-gradient(45deg,var(--accent) 0 4px,#f3c8b4 4px 8px)}
.say{font-weight:600;color:var(--ink);min-height:1.4em}
</style>
</head>
<body>
<div class="wrap">
  <header>
    <div>
      <h1>Tiny<span>Tenant</span></h1>
      <p class="tag">Someone lives in a panel block inside your computer. Watch them, talk to them, send parcels and read their letters.</p>
    </div>
    <div class="hud">
      <span class="chip" id="clock">Day 1 · 09:00</span>
      <span class="chip" id="mood">Content</span>
      <button id="mailBtn" type="button">Mail<b id="unread"></b></button>
    </div>
  </header>

  <div class="stage" id="stage">
    <canvas id="c" width="400" height="200" aria-label="The panel block"></canvas>
    <div class="bubble" id="bubble" hidden></div>
  </div>
  <p class="doing" id="doing"></p>

  <form class="talk" id="talk" autocomplete="off">
    <input id="say" maxlength="80" placeholder="Type something, e.g. please play the piano" aria-label="Say something">
    <button class="primary" type="submit">Say</button>
  </form>

  <div class="panels">
    <section>
      <h3 id="needsTitle">How they feel</h3>
      <div id="needs"></div>
    </section>
    <section>
      <h3>Visit</h3>
      <div class="row">
        <button type="button" data-do="knock">Knock</button>
        <button type="button" data-do="phone">Phone</button>
        <button type="button" data-do="cards">Play 21</button>
      </div>
      <h3>Send a parcel</h3>
      <div class="row">
        <button type="button" data-gift="food">Groceries</button>
        <button type="button" data-gift="dogfood">Dog food</button>
        <button type="button" data-gift="book">Book</button>
        <button type="button" data-gift="record">Record</button>
        <button type="button" data-gift="tonic">Tonic</button>
        <button type="button" data-gift="cigs">Cigarettes</button>
        <button type="button" data-gift="rakia">Rakia</button>
      </div>
      <p class="stock" id="stock"></p>
      <h3>Options</h3>
      <div class="row">
        <button type="button" data-speed="0">Pause</button>
        <button type="button" data-speed="1">1×</button>
        <button type="button" data-speed="4">4×</button>
        <button type="button" data-speed="15">15×</button>
        <button type="button" id="soundBtn">Sound on</button>
        <button type="button" id="newBtn">New tenant</button>
      </div>
      <p class="help" style="margin-top:10px">Tap the tenant to give them a pat. Asking nicely works better.</p>
    </section>
  </div>
</div>

<div class="modal" id="modal" hidden><div class="card" id="mcard" role="dialog" aria-modal="true"></div></div>

<script>
'use strict';
// ---------- helpers ----------
const W = 400, H = 200;
const cv = document.getElementById('c'), g = cv.getContext('2d');
g.imageSmoothingEnabled = false;
const $ = id => document.getElementById(id);
const clamp = (v, a, b) => v < a ? a : v > b ? b : v;
const rnd = (a, b) => a + Math.random() * (b - a);
const pick = (arr, r = Math.random) => arr[Math.floor(r() * arr.length)];
const cap = s => s.charAt(0).toUpperCase() + s.slice(1);
function mulberry(a) { return () => { a |= 0; a = a + 0x6D2B79F5 | 0; let t = Math.imul(a ^ a >>> 15, 1 | a); t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t; return ((t ^ t >>> 14) >>> 0) / 4294967296; }; }
function R(x, y, w, h, c) { g.fillStyle = c; g.fillRect(Math.round(x), Math.round(y), w, h); }
const hsl = (h, s, l) => `hsl(${h|0},${s|0}%,${l|0}%)`;
function shade(hex, k) {
  const n = parseInt(hex.slice(1), 16);
  const f = v => clamp(Math.round(v * k), 0, 255);
  return '#' + ((1 << 24) + (f(n >> 16) << 16) + (f(n >> 8 & 255) << 8) + f(n & 255)).toString(16).slice(1);
}
const esc = s => String(s).replace(/[&<>"]/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));

// ---------- the tenant: everything about them comes from one seed ----------
const NAMES = ['Georgi','Ivan','Dimitar','Petar','Nikolay','Stoyan','Todor','Hristo','Vasil','Krasimir','Boyan','Zhivko','Maria','Elena','Yordanka','Rumyana','Tsvetana','Desislava','Galina','Vesela','Stefka','Kalina','Radka','Neli'];
const DOGS = ['Sharo','Balkan','Mecho','Chara','Bobi','Lisa','Pufi','Topcho','Rex','Zhoro','Belcho','Murdzho'];
const NB_M = ['Ivan','Stoyan','Todor','Georgi','Petko','Dimitar','Kiro','Spas'], NB_F = ['Penka','Stefka','Radka','Tsveta','Mariyka','Vela','Gina','Donka'], NB_Y = ['Mitko','Gosho','Pesho','Ani','Vanya','Tsetso'];
const SKIN = ['#f3d3b5','#e8b48e','#c98e66','#a26a45','#7a4b2e','#f7e0cc'];
const HAIR = ['#2b1d14','#5a3a22','#8a5a2b','#c98f3e','#e2c26a','#b23a1f','#7a7a7a','#ebe5d3','#1c1c2a'];
const SHIRT = ['#d9534f','#3e7cb1','#4caf7a','#e6a23c','#8e5bb5','#e46aa0','#2f9c95','#e7c63f','#6c7a89'];
const PANTS = ['#33415c','#5b4636','#3a3a3a','#6b7d4a','#7b5e9a','#3c5a78'];
const STYLES = ['short','long','bald','curly','pony','cap','spiky'];
const FOODS = ['banitsa','shopska salad','kebapcheta','musaka','tarator','sarmi','kavarma','lyutenitsa on toast','mekitsi','bob chorba'];
const DOGCOL = ['#c8935a','#eee5d5','#5a4032','#2e2a28','#d9b26f','#a35b33'];
const ADJ = ['Quiet','Velvet','Paper','Copper','Midnight','Sleepy','Little','Crooked','Golden','Rainy','Upside-down','Humming','Lost','Silver'];
const NOUN = ['Kettle','Lighthouse','Teaspoon','Comet','Umbrella','Garden','Staircase','Radio','Pebble','Orchard','Sock','Tortoise','Clock','Moon'];
const TRAITS = ['music','books','fitness','tv','social','appetite','sleepy','tidy','smoker','drinker','seeds'];
const HOBBY = {
  music: 'tinkling away at the piano', books: 'curling up with a good book', fitness: 'jumping jacks before breakfast',
  tv: 'a good programme on the telly', social: 'writing letters and chatting on the phone', appetite: 'cooking big dinners',
  sleepy: 'long, long naps', smoker: 'a quiet cigarette on the loggia', drinker: 'a glass of rakia with a shopska salad',
  seeds: 'a bag of sunflower seeds and a good gossip', tidy: 'a clean flat and a hot shower, when there is hot water'
};

function makeTenant(seed) {
  const r = mulberry(seed);
  const t = {
    seed, name: pick(NAMES, r), dog: pick(DOGS, r), skin: pick(SKIN, r), hair: pick(HAIR, r), style: pick(STYLES, r),
    shirt: pick(SHIRT, r), pants: pick(PANTS, r), glasses: r() < .3, height: 17 + Math.floor(r() * 3),
    voice: 170 + r() * 230, food: pick(FOODS, r), dogCol: pick(DOGCOL, r), tr: {}
  };
  for (const k of TRAITS) t.tr[k] = +(0.5 + r() * 0.9).toFixed(2);
  t.fav = pick(TRAITS, r); t.tr[t.fav] = 1.8;
  t.cap = shade(t.shirt, .7);
  // house: wallpaper per room, sofa, blanket, book spines, wall pictures
  t.rooms = Array.from({ length: 8 }, () => ({ h: r() * 360, s: 30 + r() * 30, l: 82 + r() * 7, p: Math.floor(r() * 4) }));
  t.rooms[7] = { h: 35, s: 25, l: 84, p: 0 };
  t.outside = pick(['#c97a5b','#d9ae6c','#93b7cc','#a9c38c','#e2cfaa','#bba3cc'], r);
  t.roof = pick(['#7d3b2e','#4a5a6b','#5b4a3c','#3e5b49'], r);
  t.sofa = pick(SHIRT, r); t.blanket = pick(SHIRT, r);
  t.spines = Array.from({ length: 40 }, () => hsl(r() * 360, 45, 45));
  t.art = Array.from({ length: 8 }, () => [hsl(r() * 360, 50, 60), hsl(r() * 360, 50, 45), r()]);
  t.songR = Math.floor(r() * 1e9);
  t.panel = pick(['#c9c4b8','#bdb8ad','#d4cdbd','#c2c6c4','#cfc6b0'], r); t.stripe = pick(['#d9534f','#e6a23c','#3e7cb1','#4caf7a','#e7c63f','#8e5bb5'], r);
  t.rail = pick(['#d9534f','#e6a23c','#3e7cb1','#4caf7a','#e7c63f'], r); t.oil = pick(['#8fb59a','#8aaabf','#cdb878','#a9bd8f','#b7a6c4'], r);
  t.padded = pick(['#7a3b2e','#4a3a5a','#6a5032','#2f4f4f'], r); t.padded2 = pick(['#7a3b2e','#4a3a5a','#6a5032','#2f4f4f'], r);
  t.carpet = pick(['#9c2f2f','#7a2a4a','#8a4b1f','#2f4f7a'], r); t.flat = 10 + Math.floor(r() * 80);
  t.npcs = [2, 3, 0, 2, 3, 3, 2, 3, 0].map((home, i) => {
    const kind = r(), name = pick(kind < .4 ? NB_M : kind < .8 ? NB_F : NB_Y, r);
    return { home, name, title: kind < .4 ? `bay ${name}` : kind < .8 ? `lelya ${name}` : name, smoker: r() < .65, seeds: r() < .5,
      look: { skin: pick(SKIN, r), hair: kind < .8 ? pick(['#7a7a7a', '#ebe5d3', '#5a3a22', '#2b1d14', '#b0a090'], r) : pick(HAIR, r), style: pick(STYLES, r), shirt: pick(SHIRT, r),
        pants: pick(PANTS, r), glasses: r() < .4, height: 16 + Math.floor(r() * 4), cap: pick(PANTS, r) } };
  });
  t.win = Array.from({ length: 13 }, () => ({ curtain: hsl(r() * 360, 45, 70), box: r() < .3, rail: pick(['#d9534f','#e6a23c','#3e7cb1','#4caf7a','#e7c63f','#f4efe6'], r) }));
  return t;
}
function songName(i) {
  const r = mulberry(T.songR + i * 7919);
  return `${pick(['Waltz','Ballad','Rag','Nocturne','March','Lullaby','Polka','Song'], r)} of the ${pick(ADJ, r)} ${pick(NOUN, r)}`;
}
function bookTitle() {
  const a = pick(ADJ), n = pick(NOUN), n2 = pick(NOUN);
  return pick([`The ${a} ${n}`, `${n}s at Midnight`, `A Field Guide to ${n}s`, `The ${n} and the ${n2}`, `Notes from a ${a} ${n}`, `Forty ${n}s`]);
}

// ---------- the block: one flat above the lobby, neighbours' floors above, a stairwell on the right ----------
const FY = [186, 138, 90, 42]; // feet line per storey: lobby, the flat, neighbours above
const OBJ = {
  loggia: { f: 1, x: 27 }, bed: { f: 1, x: 60 }, desk: { f: 1, x: 98, dy: -3 },
  stenka: { f: 1, x: 128 }, sofa: { f: 1, x: 164, dy: -4 }, dogbed: { f: 1, x: 183 }, piano: { f: 1, x: 202, dy: -3 },
  fridge: { f: 1, x: 231 }, stove: { f: 1, x: 248 }, ksink: { f: 1, x: 266 }, table: { f: 1, x: 283, dy: -3 },
  bath: { f: 1, x: 303 }, phone: { f: 1, x: 318 }, bowl: { f: 1, x: 322 }, door: { f: 1, x: 329 },
  entrance: { f: 0, x: 40 }, mailboxes: { f: 0, x: 100 }, stairs: { f: 1, x: 362 }, outside: { f: 0, x: 6 }
};
const ROOMS = [[1, 16, 38], [1, 38, 112], [1, 112, 222], [1, 222, 290], [1, 290, 312], [1, 312, 336]]; // loggia, bedroom, living room, kitchen, bathroom, hall
const WINDOWS = [{ f: 1, x: 27, face: 0 }, { f: 1, x: 60, face: 2 }, { f: 1, x: 266, face: 2 }];
const STAIR = f => f % 2 === 0 ? [342, 378] : [378, 342]; // [bottom x, top x] of the flight from storey f up to f+1
const floorOf = y => { let b = 0; for (let i = 1; i < FY.length; i++) if (Math.abs(FY[i] - y) < Math.abs(FY[b] - y)) b = i; return b; };
const onFloor = y => FY.some(v => Math.abs(v - y) < .01);

const LIFTX = 366, LIFT = { f: 0, open: -1, until: 0 };
const liftWorks = () => !S.liftBroken;
function route(x, y, f2, x2, stairsOnly) {
  const pts = []; let f = floorOf(y);
  // the lift, when it works and you don't fancy the stairs
  if (f !== f2 && liftWorks() && !stairsOnly && Math.random() < .85) return [{ x: LIFTX, y: FY[f] }, { x: LIFTX, y: FY[f2], lift: 1 }, { x: x2, y: FY[f2] }];
  while (f !== f2) {
    if (f2 > f) { const [b, t] = STAIR(f); pts.push({ x: b, y: FY[f] }, { x: t, y: FY[f + 1], climb: 1 }); f++; }
    else { const [b, t] = STAIR(f - 1); pts.push({ x: t, y: FY[f] }, { x: b, y: FY[f - 1], climb: 1 }); f--; }
  }
  pts.push({ x: x2, y: FY[f2] });
  return pts;
}

// ---------- state ----------
const SAVE = 'tinytenant-v3';
let T, S, cur = null, queued = null, CARDS = null, speed = 1;
const P = { x: 40, y: FY[0], face: 0, pose: 'stand', arms: 'down', frame: 0, dist: 0, walking: false };
const DOG = { x: 30, y: FY[0], face: 1, state: 'sit', tx: 30, t: 5, dist: 0, follow: false };
let parts = [], bubble = { text: '', until: 0 }, ringing = null, toast = '';

function fresh(seed) {
  return {
    v: 3, seed, t: 9 * 60, arrived: false, liftBroken: 9 * 60 + 300, dogWalk: .2, drill: 0, cigs: 20, shots: 8, lastSmoke: 8 * 60, drunk: 0, shells: 0,
    needs: { food: 75, water: 75, energy: 85, fun: 65, clean: 80, social: 55, health: 100 },
    fridge: 4, dogFood: 6, bowl: 1, tonic: 1, dogHunger: .2,
    books: [bookTitle(), bookTitle(), bookTitle()], newBooks: [], records: 1, skill: 0, song: 0,
    parcel: [], letters: [], log: [], reqs: [], pets: [], knocks: [], player: '', wins: { you: 0, them: 0 },
    lastLetter: 0, recent: [], pos: { x: 40, y: FY[0] }
  };
}
function load() {
  const q = new URLSearchParams(location.search);
  let s = null;
  try { s = JSON.parse(localStorage.getItem(SAVE)); } catch (e) {}
  if (q.has('seed')) s = fresh(parseInt(q.get('seed'), 10) >>> 0);
  if (!s || s.v !== 3) s = fresh((Math.random() * 2 ** 32) >>> 0);
  S = s; T = makeTenant(S.seed);
  P.x = S.pos.x; P.y = onFloor(S.pos.y) ? S.pos.y : FY[floorOf(S.pos.y)];
  DOG.x = P.x + 12; DOG.y = S.arrived ? FY[1] : P.y; if (S.arrived && floorOf(P.y) !== 1) { P.x = OBJ.door.x - 6; P.y = FY[1]; DOG.x = P.x - 10; }
}
function save() {
  S.pos = { x: P.x, y: onFloor(P.y) ? P.y : FY[floorOf(P.y)] };
  try { localStorage.setItem(SAVE, JSON.stringify(S)); } catch (e) {}
}
const hour = () => (S.t % 1440) / 60;
const isNight = () => { const h = hour(); return h >= 22 || h < 6.5; };
const asleep = () => cur && (cur.id === 'sleep' || cur.id === 'nap') && cur.phase === 'do';
function mood() { const n = S.needs; return (n.food + n.water + n.energy + n.fun + n.clean + n.social) / 6 * .7 + n.health * .3; }
function bump(k, v) { S.needs[k] = clamp(S.needs[k] + v, 0, 100); }
function log(k, d) { S.log.push({ t: S.t, k, d }); if (S.log.length > 40) S.log.shift(); }

// ---------- activities ----------
// Each activity is a list of steps: walk to a spot, hold a pose for t game minutes, apply needs gains spread over that time.
const ACTS = {
  eat: { ok: () => S.fridge > 0, no: 'The fridge is empty!', est: { food: 65, fun: 4 }, aff: 'appetite', quips: () => [`Time for ${T.food}.`, 'My tummy is rumbling.'],
    steps: [
      { at: 'fridge', t: 3, face: 2, fx: 'fridge', label: 'raiding the fridge', begin: () => { S.fridge--; } },
      { at: 'stove', t: 14, face: 2, fx: 'cook', label: () => `cooking ${T.food}` },
      { at: 'table', t: 18, pose: 'sit', arms: 'mouth', fx: 'eat', gain: { food: 65, fun: 4 }, label: () => `eating ${T.food}` }] },
  drink: { est: { water: 55 }, quips: () => ['Thirsty work, all this.'],

  }

function sim(dt) {

// ---------- neighbours: they come and go through the lobby, smoke on the stairs and lean on their loggias ----------
let NPCS = [];
function initNpcs() {
  NPCS = T.npcs.map((n, i) => ({ n, i, state: 'home', vis: false, x: 0, y: 0, face: 0, frame: 0, dist: 0, path: [], arms: 'down', t: rnd(2, 60), greet: -999 }));
}
function npcDoor(n) { return n.home === 0 ? { f: 0, x: 302 } : n.home === 2 ? { f: 2, x: 342 } : { f: 3, x: 378 }; }
function npcGo(p, f, x, then) { p.path = route(p.x, p.y, f, x); p.state = 'walk'; p.then = then; p.vis = true; p.arms = 'down'; }
function npcAppear(p, at) { p.x = at.x; p.y = FY[at.f]; p.vis = true; }
function npcHome(p) { p.state = 'home'; p.vis = false; p.t = rnd(20, 120); }
function npcDecide(p) {
  const n = p.n, h = hour(), late = h >= 23 || h < 6, door = npcDoor(n);
  if (p.state === 'away') {
    if (late && Math.random() < .7) { p.t = 60; return; }
    npcAppear(p, { f: 0, x: 4 }); return npcGo(p, door.f, door.x, () => npcHome(p));
  }
  if (late && Math.random() < .8) { p.t = 60; return; }
  const r = Math.random();
  if (r < .3) { npcAppear(p, door); return npcGo(p, 0, 4, () => { p.state = 'away'; p.vis = false; p.t = rnd(60, 240); }); }
  if (r < .55 && n.smoker) { // a cigarette on the landing, or outside the entrance for the ground-floor flat
    npcAppear(p, door);
    const spot = n.home === 0 ? { f: 0, x: 8 } : { f: door.f, x: door.x === 342 ? 350 : 370 };
    return npcGo(p, spot.f, spot.x, () => { p.state = 'stand'; p.arms = 'smoke'; p.face = 0; p.t = rnd(8, 16); p.after = () => npcGo(p, door.f, door.x, () => npcHome(p)); });
  }
  if (r < .8 && n.home !== 0) { p.state = 'loggia'; p.vis = false; p.arms = n.smoker && Math.random() < .6 ? 'smoke' : Math.random() < .5 ? 'seeds' : 'down'; p.t = rnd(15, 40); return; }
  npcAppear(p, door); // a chat by the post boxes
  npcGo(p, 0, rnd(70, 250), () => { p.state = 'stand'; p.arms = n.seeds ? 'seeds' : 'down'; p.face = 0; p.t = rnd(8, 20); p.after = () => npcGo(p, door.f, door.x, () => npcHome(p)); });
}
function npcUpdate(dt) {
  for (const p of NPCS) {
    if (p.state === 'walk') {
      let budget = dt * 20;
      while (budget > 0 && p.path.length) {
        const q = p.path[0], dx = q.x - p.x, dy = q.y - p.y, d = Math.hypot(dx, dy), sp = q.climb ? .6 : 1;
        if (q.lift) {
          if (!liftWorks() && p.ride === undefined) { p.path = route(p.x, p.y, floorOf(q.y), p.path[1].x, true); break; }
          if (p.ride === undefined) { p.ride = 2; p.vis = false; liftDoor(floorOf(p.y)); }
          p.ride -= dt; budget = 0;
          if (p.ride <= 0) { p.ride = undefined; p.vis = true; p.x = q.x; p.y = q.y; p.path.shift(); liftDoor(floorOf(q.y)); }
          break;
        }
        if (Math.abs(dx) > .1) p.face = dx > 0 ? 1 : -1;
        const m = Math.min(d, budget * sp);
        if (d > 0) { p.x += dx / d * m; p.y += dy / d * m; }
        budget -= m / sp; p.dist += m;
        if (m >= d - 1e-6) { p.x = q.x; p.y = q.y; p.path.shift(); }
      }
      p.frame = Math.floor(p.dist / 3);
      if (!p.path.length) p.then();
      continue;
    }
    p.t -= dt;
    if (p.t > 0) continue;
    if (p.state === 'stand') p.after();
    else if (p.state === 'loggia') npcHome(p);
    else npcDecide(p);
  }
  // say hello to neighbours you pass
  if (cur && cur.phase === 'walk' && !asleep()) for (const p of NPCS) {
    if (p.vis && Math.abs(p.y - P.y) < 4 && Math.abs(p.x - P.x) < 14 && S.t - p.greet > 120) {
      p.greet = S.t; bump('social', 3); say(pick([`Zdrasti, ${p.n.title}!`, `Dobar den, ${p.n.title}!`, `Kak si, ${p.n.title}?`]));
    }
  }
}
function drawNpcs(tick) {
  for (const p of NPCS) if (p.vis && p.state !== 'loggia') {
    drawPerson(p.x, p.y, { L: p.n.look, pose: 'stand', arms: p.arms, face: p.state === 'walk' ? p.face : 0, frame: p.frame, walking: p.state === 'walk', tick });
    if (p.arms === 'smoke' && Math.random() < .05) parts.push({ x: p.x + 2, y: p.y - p.n.look.height - 1, vx: rnd(-1, 2), vy: -5, life: 2, k: 'puff' });
  }
}
function drawLoggiaNpc(f, bot, tick) {
  for (const p of NPCS) if (p.state === 'loggia' && p.n.home === f) {
    drawPerson(27, bot, { L: p.n.look, pose: 'stand', arms: p.arms, face: 0, frame: 0, walking: false, tick });
    if (p.arms === 'smoke' && Math.random() < .05) parts.push({ x: 29, y: bot - p.n.look.height - 1, vx: rnd(-1, 2), vy: -5, life: 2, k: 'puff' });
  }
}

// ---------- talking ----------

function statusLine() {

  if (n[worst] > 70) return pick(["I'm doing great, thanks!", 'Never better!', 'Pretty good, actually.']);
  return {
    food: S.fridge ? "I'm getting hungry." : "I'm hungry and the fridge is empty.", water: 'I could use a drink.', energy: "I'm so sleepy.",
    fun: "I'm a bit bored.", clean: 'I really need a shower.', social: "It's been lonely here.", health: "I don't feel so good."

function hear(raw) {

  const polite = /\b(please|pls|plz)\b/.test(t);
  if (!S.arrived) return say("Just a moment, I'm still moving in!");
  if (asleep()) {
    if (raw === raw.toUpperCase() && /[A-Z]/.test(raw)) { wake(); bump('fun', -8); say('WHAT? I was asleep!'); log('woken'); }
    else say('Zzz…');
    return;
  }
  let m;
  if ((m = raw.match(/(?:my name is|i am|i'm|call me)\s+([a-z][a-z'-]{1,15})/i)) && !/\b(hungry|tired|sorry|bored|fine|ok|okay|good|sad|here|back)\b/i.test(m[1])) {
    S.player = cap(m[1].toLowerCase()); bump('social', 5); return say(`Nice to meet you, ${S.player}!`);
  }
  if (/what'?s your name|what is your name|who are you/.test(t)) return say(`I'm ${T.name}. And this is ${T.dog}.`);
  if (/how are you|how do you feel|you ok|how'?s it going/.test(t)) return say(statusLine());
  if (/stupid|idiot|hate you|ugly|dumb|shut up|boring/.test(t)) { bump('fun', -15); bump('social', -10); log('rude'); return say("That wasn't very nice."); }
  if (/love you|you'?re (great|nice|cool|lovely|the best)|good (boy|girl|job)/.test(t)) { bump('social', 8); bump('fun', 4); log('nice'); return say('Aw, shucks.'); }
  if (/\b(cards|21|blackjack|game)\b/.test(t)) return askCards(polite);
  for (const [re, id] of COMMANDS) if (re.test(t)) return request(id, polite);
  if (/thank/.test(t)) { bump('social', 3); return say("You're welcome!"); }
  if (/\b(hi|hello|hey|howdy|hiya|good (morning|afternoon|evening))\b/.test(t)) { bump('social', 4); startAct('greet'); return say(`Hello${S.player ? ', ' + S.player : ''}!`); }
  if (/\b(bye|good ?night|see you)\b/.test(t)) return say(isNight() ? 'Night night!' : 'Bye for now!');

}
function canDo(id) {

}

// ---------- 21 ----------
function newDeck() { const d = []; for (let s = 0; s < 4; s++) for (let r = 1; r <= 13; r++) d.push({ r, s }); for (let i = d.length - 1; i > 0; i--) { const j = Math.floor(Math.random() * (i + 1)); [d[i], d[j]] = [d[j], d[i]]; } return d; }

function openCards() { CARDS = { deck: newDeck(), you: [], them: [], done: false, hands: 0, msg: '' }; deal(); }
function draw1() { if (CARDS.deck.length < 10) CARDS.deck = newDeck(); return CARDS.deck.pop(); }
function deal() {
  CARDS.you = [draw1(), draw1()]; CARDS.them = [draw1(), draw1()]; CARDS.done = false; CARDS.msg = 'Your move.';
  if (handVal(CARDS.you) === 21) return stand();
  renderCards();
}
function hit() { CARDS.you.push(draw1()); if (handVal(CARDS.you) > 21) return settle(); if (handVal(CARDS.you) === 21) return stand(); renderCards(); }
function stand() { while (handVal(CARDS.them) < 17) CARDS.them.push(draw1()); settle(); }
function settle() {
  const y = handVal(CARDS.you), t = handVal(CARDS.them);
  let res = y > 21 ? 'them' : t > 21 ? 'you' : y > t ? 'you' : t > y ? 'them' : 'push';
  CARDS.done = true; CARDS.hands++;
  bump('social', 4); bump('fun', res === 'them' ? 7 : 4);
  if (res === 'you') { S.wins.you++; log('cards-lose'); CARDS.msg = pick(["You're too good at this!", 'Beginner\'s luck!', 'Rematch!']); }
  else if (res === 'them') { S.wins.them++; log('cards-win'); CARDS.msg = y > 21 ? pick(['Bust! Ha ha!', 'Too greedy!']) : pick(['Ha! The house wins!', 'Better luck next time.']); }
  else CARDS.msg = 'A tie! Again?';
  say(CARDS.msg);
  renderCards();
}
const RANK = r => ({ 1: 'A', 11: 'J', 12: 'Q', 13: 'K' }[r] || r);
const SUIT = ['♠', '♥', '♦', '♣'];
const cardHtml = (c, hide) => hide ? '<div class="pc back"></div>' : `<div class="pc${c.s === 1 || c.s === 2 ? ' red' : ''}"><span>${RANK(c.r)}</span><span>${SUIT[c.s]}</span></div>`;
function renderCards() {
  if (!CARDS) return;
  const C = CARDS;
  modal(`<h2>21 with ${esc(T.name)}</h2>

  if (arms === 'smoke' && Math.random() < dtr * 3) parts.push({ x: P.x + 3, y: P.y - T.height - 1 + (P.pose === 'sit' ? 4 : 0), vx: rnd(-1, 2), vy: -5, life: 2, k: 'puff' });
  if (arms === 'seeds' && Math.random() < dtr * 3) parts.push({ x: P.x + rnd(-2, 3), y: P.y - 12, vx: rnd(-3, 3), vy: 14, life: .8, k: 'shell' });
  if (S.drill && Math.random() < dtr * 10) parts.push({ x: rnd(40, 330), y: FY[2] + 3, vx: rnd(-1, 1), vy: 12, life: 1.5, k: 'dust' });
  for (const p of parts) { p.x += p.vx * dtr; p.y += p.vy * dtr; p.life -= dtr; }
  parts = parts.filter(p => p.life > 0 && p.y < (p.k === 'drop' ? fy - 9 : p.k === 'shell' ? Math.round(p.y) >= FY[floorOf(p.y)] ? -1 : 999 : 999));
  for (const p of parts) {
    const x = Math.round(p.x), y = Math.round(p.y);
    if (p.k === 'z') { R(x, y, 3, 1, '#5a6bd6'); R(x + 1, y + 1, 1, 1, '#5a6bd6'); R(x, y + 2, 3, 1, '#5a6bd6'); }
    if (p.k === 'note') { R(x, y + 2, 2, 2, '#333'); R(x + 1, y - 1, 1, 3, '#333'); R(x + 2, y - 1, 1, 1, '#333'); }
    if (p.k === 'steam') R(x, y, 1, 1, 'rgba(255,255,255,.8)');
    if (p.k === 'drop') R(x, y, 1, 2, '#6fb3e0');
    if (p.k === 'dust') R(x, y, 1, 1, '#9a948a');
    if (p.k === 'puff') R(x, y, p.life > 1 ? 1 : 2, 1, 'rgba(200,200,200,.75)');
    if (p.k === 'shell') R(x, y, 1, 1, '#333');
    if (p.k === 'heart') { R(x, y, 1, 1, '#e0436b'); R(x + 2, y, 1, 1, '#e0436b'); R(x, y + 1, 3, 1, '#e0436b'); R(x + 1, y + 2, 1, 1, '#e0436b'); }
  }
}
function heart(x, y) { for (let i = 0; i < 3; i++) parts.push({ x: x + rnd(-4, 3), y: y - i * 3, vx: rnd(-2, 2), vy: -8, life: 1.4, k: 'heart' }); }

function draw(dtr) {
  const tick = Math.floor(performance.now() / 250), fy = FY[1];
  drawHouse(tick);
  const st = cur && cur.phase === 'do' ? step() : null;
  const inBed = st && st.pose === 'lie' && st.at === 'bed';
  const at = st && (st.pickAt ? cur.pick : st.at), seat = at && OBJ[at] ? (OBJ[at].dy || 0) : 0;
  const y = P.pose === 'lie' ? (inBed ? fy - 11 : fy - 8) : P.y + (P.pose === 'sit' ? seat : 0);
  const hidden = st && st.hidden;
  chair(OBJ.desk.x, fy);
  if (!((hidden || P.inLift) && DOG.follow)) drawDog(tick);
  drawNpcs(tick);
  for (let k = 0; k < Math.min(S.shells, 12) * 2; k++) R(150 + (k * 37) % 40, fy - 1, 1, 1, '#333');
  if (!hidden && !P.inLift) drawPerson(P.x + (S.drunk > .5 && P.walking ? Math.round(Math.sin(performance.now() / 250)) : 0), y, { pose: P.pose, arms: P.arms, face: P.face, frame: P.frame, walking: P.walking && cur && cur.phase === 'walk', tick });
  foreground();
  const bx = OBJ.bed.x;
  R(bx - 9, fy - (inBed ? 13 : 12), 26, inBed ? 5 : 3, T.blanket); R(bx - 9, fy - (inBed ? 13 : 12), 26, 1, shade(T.blanket, 1.2));
  particlesStep(dtr, tick);
  // evening: the flat goes dark while the tenant sleeps
  const s = sky(), dark = (1 - s.day) * (asleep() && cur.id === 'sleep' ? .55 : .12);
  if (dark > .01) { g.fillStyle = `rgba(20,24,60,${dark})`; g.fillRect(16, fy - 46, 320, 46); g.fillStyle = `rgba(20,24,60,${(1 - s.day) * .1})`; g.fillRect(16, FY[0] - 46, 368, 46); }
  if (dark > .2 && !asleep()) { g.fillStyle = 'rgba(255,230,150,.08)'; g.fillRect(38, fy - 46, 298, 46); }
}

// ---------- UI ----------
const NEEDS = [['food', 'Food'], ['water', 'Water'], ['energy', 'Energy'], ['fun', 'Fun'], ['clean', 'Clean'], ['social', 'Company'], ['health', 'Health']];
function buildNeeds() {
  $('needs').innerHTML = NEEDS.map(([k, l]) => `<div class="need"><span>${l}</span><div class="bar"><i id="n-${k}"></i></div></div>`).join('');
}
let uiAt = 0;
function updateUI(now) {
  if (now - uiAt < 200) return; uiAt = now;
  const d = Math.floor(S.t / 1440) + 1, h = Math.floor(hour()), m = Math.floor(S.t % 60);
  $('clock').textContent = `Day ${d} · ${String(h).padStart(2, '0')}:${String(m).padStart(2, '0')}`;
  const md = mood();
  $('mood').textContent = md > 80 ? 'Cheerful' : md > 62 ? 'Content' : md > 45 ? 'So-so' : md > 28 ? 'Glum' : 'Miserable';
  for (const [k] of NEEDS) { const el = $('n-' + k), v = S.needs[k]; el.style.width = v + '%'; el.style.background = v > 55 ? 'var(--good)' : v > 28 ? 'var(--warn)' : 'var(--bad)'; }
  let label = '';
  if (cur) { const st = step(), l = typeof st.label === 'function' ? st.label() : st.label; label = l || ''; }
  $('doing').innerHTML = toast ? `<b>${esc(toast)}</b>` : `<b>${esc(T.name)}</b> is ${esc(label || 'thinking')}.`;
  const u = S.letters.filter(l => !l.read).length;
  $('unread').textContent = u ? u : '';
  $('stock').textContent = `Fridge: ${S.fridge} · Dog food: ${S.dogFood} · Tonic: ${S.tonic} · Cigarettes: ${S.cigs} · Rakia: ${S.shots} shots · Books: ${S.books.length} · Records: ${S.records}${S.parcel.length ? ` · Waiting at the door: ${S.parcel.length}` : ''}`;
  $('needsTitle').textContent = `How ${T.name} feels`;
  $('say').placeholder = `Type to ${T.name}, e.g. please play the piano`;
}
let toastAt = 0;
function updateBubble(now) {
  const b = $('bubble');
  if (now > bubble.until) { b.hidden = true; return; }
  if (b.textContent !== bubble.text) b.textContent = bubble.text;
  b.hidden = false;
  const lying = P.pose === 'lie';
  const inBed = cur && cur.phase === 'do' && step().at === 'bed';
  const px = lying ? P.x - 12 : P.x, py = lying ? FY[1] - (inBed ? 18 : 16) : P.y - T.height - 4;
  b.style.left = clamp(px / W * 100, 14, 86) + '%';
  b.style.top = Math.max(py / H * 100, 12) + '%';
}

let modalClose = null;
function modal(html, onClose) { $('mcard').innerHTML = html; $('modal').hidden = false; modalClose = onClose || hideModal; const b = $('mcard').querySelector('button.primary, button'); if (b && document.activeElement?.closest?.('#mcard') == null) b.focus({ preventScroll: true }); }
function hideModal() { $('modal').hidden = true; modalClose = null; }
function showMail() {
  const L = S.letters.map((l, i) => ({ l, i })).reverse();
  modal(`<h2>Letters from ${esc(T.name)}</h2>
    ${L.length ? `<ul class="mail">${L.map(({ l, i }) => `<li><button data-letter="${i}" class="${l.read ? '' : 'unread'}"><span>${esc(l.text.split('\n').find((s, k) => k > 1 && s) || 'A letter').slice(0, 48)}…</span><small>Day ${Math.floor(l.t / 1440) + 1}</small></button></li>`).join('')}</ul>` : '<p>No letters yet. They write when they feel like it.</p>'}
    <div class="row"><button data-m="close">Close</button></div>`);
}
function showLetter(i) {
  const l = S.letters[i]; if (!l) return;
  l.read = true;
  modal(`<div class="letter">${esc(l.text)}</div><div class="row"><button data-m="mail">All letters</button><button class="primary" data-m="close">Close</button></div>`);
}
function showIntro() {
  modal(`<h2>Someone is moving in</h2>
    <p><b>${esc(T.name)}</b> and their dog <b>${esc(T.dog)}</b> are moving into flat ${T.flat}, in a concrete panel block inside your computer. They have their own habits and moods, and they love ${esc(HOBBY[T.fav])}.</p>
    <p>Watch what they get up to, type requests, send parcels when the fridge runs low, and check the mailbox for letters.</p>
    <div class="row"><button class="primary" id="startBtn" data-m="start">Let them in</button></div>`, () => {});
}
function confirmNew() {
  modal(`<h2>New tenant?</h2><p>${esc(T.name)} and ${esc(T.dog)} will move out, and someone new moves in. Their letters go with them.</p>
    <div class="row"><button data-m="close">Keep ${esc(T.name)}</button><button class="primary" data-m="reset">Move someone new in</button></div>`);
}
$('mcard').addEventListener('click', e => {
  const b = e.target.closest('button'); if (!b) return;
  if (b.dataset.letter) return showLetter(+b.dataset.letter);
  const m = b.dataset.m, c = b.dataset.c;
  if (m === 'close') hideModal();
  if (m === 'mail') showMail();
  if (m === 'start') { audioOn(); hideModal(); started = true; }
  if (m === 'reset') { cur = null; queued = null; CARDS = null; S = fresh((Math.random() * 2 ** 32) >>> 0); T = makeTenant(S.seed); initNpcs(); P.x = 40; P.y = FY[0]; DOG.x = 30; DOG.y = FY[0]; DOG.follow = false; parts = []; save(); showIntro(); started = false; }
  if (c === 'hit') hit(); if (c === 'stand') stand(); if (c === 'deal') deal(); if (c === 'leave') closeCards();
});
$('modal').addEventListener('click', e => { if (e.target === $('modal') && modalClose && started) modalClose(); });
document.addEventListener('keydown', e => { if (e.key === 'Escape' && !$('modal').hidden && started && modalClose) modalClose(); });
$('mailBtn').onclick = () => { audioOn(); showMail(); };
$('newBtn').onclick = confirmNew;
$('talk').addEventListener('submit', e => { e.preventDefault(); const v = $('say').value; $('say').value = ''; if (!started) return; hear(v); });
document.querySelectorAll('[data-do]').forEach(b => b.onclick = () => { if (!started) return; const k = b.dataset.do; if (k === 'knock') knock(); if (k === 'phone') phone(); if (k === 'cards') askCards(true); });
document.querySelectorAll('[data-gift]').forEach(b => b.onclick = () => { if (started) gift(b.dataset.gift); });
document.querySelectorAll('[data-speed]').forEach(b => b.onclick = () => setSpeed(+b.dataset.speed));
function setSpeed(v) { speed = v; document.querySelectorAll('[data-speed]').forEach(b => b.classList.toggle('on', +b.dataset.speed === v)); }
function setSound() { $('soundBtn').textContent = AU.muted ? 'Sound off' : 'Sound on'; $('soundBtn').classList.toggle('on', !AU.muted); if (AU.out) AU.out.gain.value = AU.muted ? 0 : .55; }
$('soundBtn').onclick = () => { AU.muted = !AU.muted; try { localStorage.setItem('tinytenant-muted', AU.muted ? '1' : '0'); } catch (e) {} audioOn(); setSound(); };
cv.addEventListener('pointerdown', e => {
  if (!started) return;
  audioOn();
  const r = cv.getBoundingClientRect(), x = (e.clientX - r.left) / r.width * W, y = (e.clientY - r.top) / r.height * H;
  if (Math.abs(x - OBJ.mailboxes.x) < 16 && y > FY[0] - 34 && y < FY[0] - 12) return showMail();
  const lying = P.pose === 'lie', px = lying ? P.x - 4 : P.x, top = lying ? P.y - 30 : P.y - T.height - 2;
  if (Math.abs(x - px) < (lying ? 14 : 6) && y > top - 2 && y < (lying ? P.y + 2 : P.y + 1) + (lying ? 0 : 0) + 2) return pat();
  if (Math.abs(x - DOG.x) < 7 && y > DOG.y - 12 && y < DOG.y + 2) { bark(); heart(DOG.x, DOG.y - 10); if (DOG.state !== 'walk') { DOG.state = 'held'; DOG.t = 2; } return; }
  if (Math.abs(x - OBJ.door.x) < 7 && y > FY[1] - 31 && y < FY[1]) return knock();
  if (Math.abs(x - OBJ.phone.x) < 5 && y > FY[1] - 27 && y < FY[1] - 15) return phone();
});
document.addEventListener('pointerdown', () => audioOn(), { once: true });
addEventListener('pagehide', save);
document.addEventListener('visibilitychange', () => { if (document.hidden) save(); });

// ---------- main loop ----------
let started = false, last = performance.now(), saveAt = 0, toastSet = '';
function frame(now) {
  const dtr = Math.min(.25, (now - last) / 1000); last = now;
  if (started && speed > 0 && !(CARDS && speed > 1)) sim(dtr * speed);
  draw(dtr);
  tickLoop();
  if (toast !== toastSet) { toastSet = toast; toastAt = now; }
  if (toast && now - toastAt > 3500) { toast = ''; toastSet = ''; }
  updateUI(now); updateBubble(now);
  if (started && now - saveAt > 10000) { saveAt = now; save(); }
  requestAnimationFrame(frame);
}
load(); initNpcs(); buildNeeds(); setSpeed(1); setSound();
if (!S.arrived && !S.letters.length) showIntro(); else started = true;
if (S.arrived) { P.y = FY[floorOf(P.y)]; }
window.__tt = { get S() { return S; }, get T() { return T; }, get cur() { return cur; }, sim, hear, gift, knock, phone, act: id => startAct(id), DOG, P, start: () => { hideModal(); started = true; } };
requestAnimationFrame(frame);
</script>
</body>
</html>
