<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="description" content="Threadline: crawl walls, swing on webs and solve trap rooms to rescue the film crew of the Lumen Lot.">
<title>Threadline</title>
<style>
/* Layout: title bar with HUD, pixel canvas with an overlay card, hint line, thumb pad (touch only), key legend */
:root{color-scheme:light;--bg:#f4f1ea;--panel:#fffdf8;--ink:#2b2a28;--muted:#6a665e;--line:#d8d2c4;--accent:#1f8a87;--warn:#d9573b;--ui:system-ui,-apple-system,"Segoe UI",sans-serif}
*{box-sizing:border-box}
html,body{margin:0;background:var(--bg);color:var(--ink)}
body{font-family:var(--ui);-webkit-tap-highlight-color:transparent;touch-action:manipulation}
.wrap{max-width:980px;margin:0 auto;padding:14px max(16px,env(safe-area-inset-right,0px)) 24px max(16px,env(safe-area-inset-left,0px));display:grid;gap:10px}
.top{display:flex;flex-wrap:wrap;align-items:center;gap:8px 14px}
.top h1{margin:0;font-size:1.35rem;letter-spacing:.02em}
.top h1 a{color:inherit;text-decoration:none}
#where{color:var(--muted);font-size:.92rem;flex:1;min-width:140px}
.hud{display:flex;flex-wrap:wrap;gap:8px 14px;align-items:center;font-size:.85rem;font-weight:600}
.meter{display:flex;align-items:center;gap:6px}
.bar{width:90px;height:10px;border:1px solid var(--ink);border-radius:3px;background:#fff;overflow:hidden}
.bar i{display:block;height:100%;width:100%;transition:width .12s}
#eBar{background:#e0533d}#wBar{background:#8fb7c9}
#lives{letter-spacing:2px;color:var(--warn)}
.icon{border:1px solid var(--ink);background:var(--panel);border-radius:4px;font:inherit;font-size:.8rem;padding:3px 8px;cursor:pointer;color:var(--ink)}
.stage{position:relative;border:2px solid var(--ink);border-radius:6px;overflow:hidden;background:#e8eef0;aspect-ratio:480/288;user-select:none;-webkit-user-select:none;-webkit-touch-callout:none}
#c{display:block;width:100%;height:100%;image-rendering:pixelated;touch-action:none;cursor:crosshair}
.overlay{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;padding:12px;background:rgba(247,244,236,.78);overflow:auto}
.overlay[hidden]{display:none}
@media (max-width:640px){.stage:has(.overlay:not([hidden])){aspect-ratio:auto;min-height:470px}}
.card{background:var(--panel);border:2px solid var(--ink);border-radius:8px;padding:16px 18px;max-width:460px;width:100%;text-align:center;box-shadow:0 4px 0 rgba(43,42,40,.18)}
.card h2{margin:0 0 4px;font-size:1.6rem;letter-spacing:.03em}
.card p{margin:8px 0;line-height:1.45;font-size:.95rem}
.card .sub{color:var(--muted);font-size:.85rem}
.btns{display:flex;flex-wrap:wrap;gap:8px;justify-content:center;margin-top:12px}
.btns button,.sets button{font:inherit;font-weight:700;border:2px solid var(--ink);background:#fff;color:var(--ink);border-radius:6px;padding:8px 16px;cursor:pointer}
.btns button.go{background:var(--accent);border-color:#145e5c;color:#fff}
.btns button:focus-visible,.sets button:focus-visible{outline:3px solid #f2b33d;outline-offset:2px}
.sets{display:grid;grid-template-columns:repeat(2,1fr);gap:6px;margin-top:10px}
.sets button{padding:6px 8px;font-size:.85rem;font-weight:600}
.sets button:disabled{opacity:.4;cursor:default}
#hint{margin:0;min-height:1.4em;color:var(--muted);font-size:.9rem;text-align:center}
.pad{display:none;justify-content:space-between;gap:12px;touch-action:none}
.touch .pad{display:flex}
.dpad{display:grid;grid-template-columns:repeat(3,56px);grid-template-rows:repeat(3,48px);gap:4px}
.pad button{font:inherit;font-weight:800;border:2px solid var(--ink);border-radius:10px;background:#fff;color:var(--ink);touch-action:none;user-select:none;-webkit-user-select:none}
.pad button.on{background:#d7efee}
.dpad .u{grid-area:1/2}.dpad .l{grid-area:2/1}.dpad .r{grid-area:2/3}.dpad .d{grid-area:3/2}
.acts{display:grid;grid-template-columns:repeat(2,76px);gap:8px;align-content:center}
.acts button{height:76px;border-radius:50%}
.acts .web{background:#e8f3f3}
.keys{color:var(--muted);font-size:.82rem;line-height:1.6;text-align:center;margin:0}
.touch .keys{display:none}
kbd{border:1px solid var(--line);border-bottom-width:2px;border-radius:3px;padding:0 4px;background:#fff;font:inherit;font-size:.78rem}
</style>
</head>

<div class="wrap">
  <div class="top">
    <h1><a href="../">Threadline</a></h1>
    <span id="where">Lumen Lot</span>
    <div class="hud">
      <span class="meter">Energy <span class="bar"><i id="eBar"></i></span></span>
      <span class="meter">Web <span class="bar"><i id="wBar"></i></span></span>
      <span id="lives" aria-label="lives">♥♥♥</span>
      <button class="icon" id="pauseBtn" type="button">Pause</button>
      <button class="icon" id="muteBtn" type="button">Sound on</button>
    </div>
  </div>
  <div class="stage">
    <canvas id="c" width="480" height="288" aria-label="Game screen"></canvas>
    <div class="overlay" id="overlay"><div class="card" id="card"></div></div>
  </div>
  <p id="hint"></p>
  <div class="pad" id="pad">
    <div class="dpad">
      <button class="u" data-k="up" aria-label="Up">▲</button>
      <button class="l" data-k="left" aria-label="Left">◀</button>
      <button class="r" data-k="right" aria-label="Right">▶</button>
      <button class="d" data-k="down" aria-label="Down">▼</button>
    </div>
    <div class="acts">
      <button class="web" data-k="web">WEB</button>
      <button data-k="jump">JUMP</button>
    </div>
  </div>
  <p class="keys"><kbd>←</kbd><kbd>→</kbd> move · <kbd>↑</kbd><kbd>↓</kbd> climb, reel the web · <kbd>Z</kbd>/<kbd>Space</kbd> jump · <kbd>X</kbd> or click: web (fire again to let go) · <kbd>R</kbd> restart room · <kbd>P</kbd> pause · <kbd>M</kbd> mute</p>
</div>

// ---------------------------------------------------------------------------------------------
// Threadline: an original wall-crawling, web-swinging room puzzler on a haunted film lot.
// Mechanics follow the 1990 DOS wall-crawler games: flip-screen rooms, cling to any rough surface,
// fire a web line to swing or to trip switches from afar, a limited web fluid tank and an energy bar.
// ---------------------------------------------------------------------------------------------
const T = 16, W = 30, H = 18, VW = W * T, VH = H * T;

/* Map legend

   4  beam, off while a plate is pressed            _  pressure plate (sits in a one-tile notch)

const STAGES = [

      '#...........5........A..B..C.#',

      '##############################'] },

];

// ----- state -----
const S = {
  mode: 'title', stage: 0, room: 0, lives: 3, energy: 100, web: WEB_MAX, frame: 0, deaths: 0, time: 0,
  grid: null, ch: null, ents: [], crates: [], bullets: [], shot: null, sparks: [],
  P: null, entry: null, touching: new Set(), msg: null, shake: 0,
};
const save = { unlocked: 1, best: null };
try { Object.assign(save, JSON.parse(localStorage.getItem('threadline') || '{}')); } catch (e) {}
function persist() { try { localStorage.setItem('threadline', JSON.stringify(save)); } catch (e) {} }

const cur = () => STAGES[S.stage].rooms[S.room];
const hasLeft = () => S.room > 0;
const hasRight = () => S.room < STAGES[S.stage].rooms.length - 1;

// ----- tiles -----
function tileAt(tx, ty) {
  if (ty < 0) return '#';
  if (ty >= H) return '.';
  if (tx < 0) return hasLeft() ? '.' : '#';
  if (tx >= W) return hasRight() ? '.' : '#';
  return S.grid[ty][tx];
}
function solidChar(c) {
  switch (c) {
    case '#': case 'X': case '=': case 'a': case 'b': case 'c': return true;
    case 'A': case 'B': case 'C': return !S.ch[c.toLowerCase()];
    case 'D': return !S.ch.d;
  }
  return false;
}
const stickyChar = c => c === '#';
function beamOn(c) {
  switch (c) {
    case '1': return !S.ch.a; case '2': return !S.ch.b; case '3': return !S.ch.c;
    case '5': return !!S.ch.a; case '6': return !!S.ch.b; case '7': return !!S.ch.c;
    case '4': return !S.ch.d;
  }
  return false;
}
const isBeam = c => '1234567'.includes(c);
function beamCh(c) { return c === '4' ? 'd' : 'abc'['1235670'.indexOf(c) % 4] || 'a'; }
function tilesIn(x, y, w, h, fn) {
  const x0 = Math.floor(x / T), x1 = Math.floor((x + w - 0.001) / T), y0 = Math.floor(y / T), y1 = Math.floor((y + h - 0.001) / T);
  for (let ty = y0; ty <= y1; ty++) for (let tx = x0; tx <= x1; tx++) { const r = fn(tileAt(tx, ty), tx, ty); if (r) return r; }
  return false;
}
const overlap = (a, b) => a.x < b.x + b.w && a.x + a.w > b.x && a.y < b.y + b.h && a.y + a.h > b.y;
function hit(e, x, y) {
  const box = { x, y, w: e.w, h: e.h };
  if (tilesIn(x, y, e.w, e.h, c => solidChar(c))) return true;
  for (const k of S.crates) if (k !== e && overlap(box, k)) return k;
  if (e.isCrate && S.P && overlap(box, S.P) && y > e.y) return S.P;
  return false;
}
// move along one axis in pixel steps; returns what blocked it (or false). A blocked mover ends flush against the obstacle.
function flush(e, axis, s) {
  const v = e[axis], f = (s > 0 ? Math.ceil(v) : Math.floor(v)) - v;
  if (f && !(axis === 'x' ? hit(e, v + f, e.y) : hit(e, e.x, v + f))) e[axis] = v + f;
}
function move(e, d, axis, stepUp) {
  let rem = d;
  while (Math.abs(rem) > 1e-6) {
    const s = Math.sign(rem) * Math.min(1, Math.abs(rem));
    if (axis === 'x') {
      const b = hit(e, e.x + s, e.y);
      if (b) {
        let up = 0;
        if (stepUp) for (let u = 1; u <= 3; u++) if (!hit(e, e.x, e.y - u) && !hit(e, e.x + s, e.y - u)) { up = u; break; }
        if (!up) { flush(e, 'x', s); return b; }
        e.y -= up;
      }
      e.x += s;
    } else {
      const b = hit(e, e.x, e.y + s);
      if (b) { flush(e, 'y', s); return b; }
      e.y += s;
    }
    rem -= s;
  }
  return false;
}
function stickySide(e, s) {
  const x = s < 0 ? e.x - 1 : e.x + e.w;
  return tilesIn(x, e.y + 2, 1, e.h - 4, c => stickyChar(c));
}
const stickyAbove = e => tilesIn(e.x + 1, e.y - 1, e.w - 2, 1, c => stickyChar(c));
const onFloor = e => !!hit(e, e.x, e.y + 1);
// push an entity out of anything that closed on it
function unstick(e) {
  if (!hit(e, e.x, e.y)) return;
  for (let d = 1; d <= 20; d++) for (const [dx, dy] of [[d, 0], [-d, 0], [0, -d], [0, d]])
    if (!hit(e, e.x + dx, e.y + dy)) { e.x += dx; e.y += dy; return; }
}

// ----- room setup -----
function loadRoom(stage, room, from) {
  S.stage = stage; S.room = room;
  const r = cur();
  S.grid = r.map.map(row => row.split(''));
  S.ch = { a: 0, b: 0, c: 0, d: 0 };
  S.ents = []; S.crates = []; S.bullets = []; S.sparks = []; S.touching = new Set();
  let start = null;
  for (let ty = 0; ty < H; ty++) for (let tx = 0; tx < W; tx++) {
    const c = S.grid[ty][tx], x = tx * T, y = ty * T;
    if ('SKrftWEH'.includes(c)) S.grid[ty][tx] = '.';
    if (c === 'S') start = { x: x + 3, y: y + 2 };
    else if (c === 'K') S.crates.push({ isCrate: true, x: x + 1, y, w: 14, h: 16, vy: 0 });
    else if (c === 'r') S.ents.push({ kind: 'robot', x: x + 2, y: y + 4, w: 12, h: 12, vx: 0.7, vy: 0, stun: 0, t: 0 });
    else if (c === 'f') S.ents.push({ kind: 'drone', x: x + 2, y: y + 3, w: 12, h: 10, hx: x + 2, hy: y + 3, vx: 0, vy: 0, stun: 0, t: tx * 7 });

// ----- web line -----
// trace a ray and report the first thing it meets: a sticky surface, a switch, an enemy, or something else
function trace(x0, y0, ang, range) {

    const x = x0 + dx * d, y = y0 + dy * d;
    for (const e of S.ents) if ((e.kind === 'robot' || e.kind === 'drone' || e.kind === 'turret') && x > e.x - 1 && x < e.x + e.w + 1 && y > e.y - 1 && y < e.y + e.h + 1) return { what: 'foe', e, x, y, d };
    for (const k of S.crates) if (x > k.x && x < k.x + k.w && y > k.y && y < k.y + k.h) return { what: 'block', x, y, d };
    const tx = Math.floor(x / T), ty = Math.floor(y / T), c = tileAt(tx, ty);
    if (x < 0 || x >= VW || y < 0 || y >= VH) return { what: 'none', x, y, d };
    if (solidChar(c)) return { what: 'abc'.includes(c) ? 'switch' : stickyChar(c) ? 'stick' : 'block', x, y, d, tx, ty };

}
function fireWeb(ang, assist) {
  const P = S.P;

  const cx = P.x + P.w / 2, cy = P.y + 4;
  if (assist) {
    // keyboard aim: look up to 35 degrees either side for something worth hitting, nearest angle first
    let best = null;

      const a = ang + sgn * i * Math.PI / 72, r = trace(cx, cy, a, WEB_RANGE);
      if (r.what === 'stick' || r.what === 'switch' || r.what === 'foe') { best = a; break scan; }
    }
    if (best !== null) ang = best;
  }
  S.web -= WEB_COST;
  sfx('web');
  // the line is instant: it lands on whatever the ray meets first
  const r = trace(cx, cy, ang, WEB_RANGE);
  if (r.what === 'stick') {
    P.ax = r.x; P.ay = r.y; P.state = 'swing';
    const d = Math.hypot(cx - r.x, P.y + P.h / 2 - r.y);

  else if (r.what === 'foe') { r.e.stun = r.e.kind === 'turret' ? 300 : 360; sfx('tie'); puff(r.x, r.y, '#fff'); }
  else { sfx('miss'); puff(r.x, r.y, '#e6e6e6'); }

function updatePlayer() {

      P.anim += Math.abs(P.vx) * 0.13;

    if (solidChar(tileAt(Math.floor(x / T), Math.floor(y / T)))) return false;

    line(cx, cy, P.ax, P.ay);
    g.strokeStyle = '#fff'; g.lineWidth = 1; g.beginPath();
    for (let i = 0; i < 4; i++) { const a = i * Math.PI / 4; g.moveTo(P.ax - Math.cos(a) * 3, P.ay - Math.sin(a) * 3); g.lineTo(P.ax + Math.cos(a) * 3, P.ay + Math.sin(a) * 3); }
    g.stroke();
  }
  if (S.webFade) { g.globalAlpha = S.webFade.t / 8; line(cx, cy, S.webFade.x1, S.webFade.y1); g.globalAlpha = 1; }
}
let alpha = 1;
function render() {
  const g = ctx;
  g.setTransform(1, 0, 0, 1, 0, 0);
  if (!S.grid) return;
  const sh = S.shake ? (Math.random() - 0.5) * S.shake : 0;
  g.setTransform(1, 0, 0, 1, sh, 0);
  g.drawImage(bake, 0, 0);
  drawDynamicTiles(g);
  drawEnts(g);
  if (S.mode !== 'title') {
    // draw Wren between the last two physics steps so motion stays smooth on fast displays
    const P = S.P, x = P.x, y = P.y, k = Math.min(1, alpha);
    if (P.px !== undefined && Math.abs(P.px - x) < 24 && Math.abs(P.py - y) < 24) { P.x = P.px + (x - P.px) * k; P.y = P.py + (y - P.py) * k; }
    drawWeb(g); drawWren(g); P.x = x; P.y = y;
  }
  for (const s of S.sparks) { g.fillStyle = s.col; g.globalAlpha = Math.min(1, s.t / 10); g.fillRect(s.x, s.y, 2, 2); }
  g.globalAlpha = 1;
  g.setTransform(1, 0, 0, 1, 0, 0);
  if (S.msg && S.mode === 'play') {
    g.font = 'bold 11px system-ui,sans-serif'; g.textAlign = 'center';
    const w = g.measureText(S.msg.text).width + 16;
    g.fillStyle = 'rgba(255,253,248,.92)'; g.fillRect(VW / 2 - w / 2, 8, w, 18); g.strokeStyle = '#2b2a28'; g.strokeRect(VW / 2 - w / 2 + 0.5, 8.5, w - 1, 17);
    g.fillStyle = '#2b2a28'; g.fillText(S.msg.text, VW / 2, 21);
  }
  eBar.style.width = Math.max(0, S.energy) + '%';
  wBar.style.width = (S.web / WEB_MAX * 100) + '%';
  livesEl.textContent = '♥'.repeat(Math.max(0, S.lives)) + '♡'.repeat(Math.max(0, 3 - S.lives));
}

// ----- UI -----
const overlay = document.getElementById('overlay'), card = document.getElementById('card'), hintEl = document.getElementById('hint');
const eBar = document.getElementById('eBar'), wBar = document.getElementById('wBar'), livesEl = document.getElementById('lives');
const whereEl = document.getElementById('where'), pauseBtn = document.getElementById('pauseBtn'), muteBtn = document.getElementById('muteBtn');
muteBtn.textContent = muted ? 'Sound off' : 'Sound on';
muteBtn.onclick = () => toggleMute();
pauseBtn.onclick = () => togglePause();
function setWhere() { whereEl.textContent = `Set ${S.stage + 1}: ${STAGES[S.stage].name} · ${cur().name}`; }
const fmtTime = f => { const s = Math.floor(f / 60); return Math.floor(s / 60) + ':' + String(s % 60).padStart(2, '0'); };
function setMode(m) {
  S.mode = m; keys.clear();
  overlay.hidden = m === 'play';
  pauseBtn.textContent = m === 'paused' ? 'Resume' : 'Pause';
  let h = '';
  if (m === 'title') {
    h = `<h2>Threadline</h2><p class="sub">A wall-crawling, web-slinging rescue on the Lumen Lot</p>
      <p>The Projectionist has locked the film crew inside their own sets, and your brother Ossie is up in the booth. Climb any rough wall, swing on your web line, trip switches from afar and get everyone out.</p>
      <div class="btns"><button class="go" data-a="play">${save.unlocked > 1 ? 'Continue' : 'Play'}</button></div>
      <div class="sets">${STAGES.map((s, i) => `<button data-set="${i}" ${i < save.unlocked ? '' : 'disabled'}>Set ${i + 1}: ${s.name}</button>`).join('')}</div>`;
  } else if (m === 'paused') {
    h = `<h2>Paused</h2><p>${STAGES[S.stage].name} · ${cur().name}</p><p class="sub">${cur().hint}</p>
      <div class="btns"><button class="go" data-a="resume">Resume</button><button data-a="restart">Restart room</button><button data-a="menu">Title</button></div>`;
  } else if (m === 'rescued') {
    const c = STAGES[S.stage].crew;
    h = `<h2>${c.name} is free!</h2><p>You cut ${c.name}, ${c.role}, loose. "The Projectionist went up through the next set. Go!"</p>
      <p class="sub">Set time ${fmtTime(S.time)} · ${S.deaths} lost ${S.deaths === 1 ? 'life' : 'lives'}</p>
      <div class="btns"><button class="go" data-a="next">Next set: ${STAGES[S.stage + 1].name}</button><button data-a="menu">Title</button></div>`;
  } else if (m === 'win') {
    h = `<h2>That's a wrap</h2><p>Ossie is free and the Projectionist's last reel is tangled in web. The crew of the Lumen Lot walks out into the daylight.</p>
      <p class="sub">Final set ${fmtTime(S.time)} · ${S.deaths} lost ${S.deaths === 1 ? 'life' : 'lives'}</p>
      <div class="btns"><button class="go" data-a="menu">Title</button><button data-a="again">Replay the booth</button></div>`;
  } else if (m === 'over') {
    h = `<h2>Cut!</h2><p>Out of lives on ${STAGES[S.stage].name}. The set resets, and so do you.</p>
      <div class="btns"><button class="go" data-a="again">Retry set ${S.stage + 1}</button><button data-a="menu">Title</button></div>`;
  }
  if (h) card.innerHTML = h;
  for (const b of card.querySelectorAll('button')) b.onclick = () => {
    audioInit();
    const a = b.dataset.a;
    if (b.dataset.set) startStage(+b.dataset.set);
    else if (a === 'play') startStage(Math.min(save.unlocked, STAGES.length) - 1);
    else if (a === 'resume') setMode('play');
    else if (a === 'restart') { setMode('play'); restartRoom(false); }
    else if (a === 'menu') { loadRoom(0, 0, 'start'); setMode('title'); }
    else if (a === 'next') startStage(S.stage + 1);
    else if (a === 'again') startStage(S.stage);
  };
  const go = card.querySelector('button.go'); if (go && m !== 'play') go.focus({ preventScroll: true });
}
function togglePause() { if (S.mode === 'play') setMode('paused'); else if (S.mode === 'paused') setMode('play'); }
document.addEventListener('visibilitychange', () => { if (document.hidden && S.mode === 'play') setMode('paused'); });

// ----- main loop -----
let acc = 0, lastT = 0;
function frame(t) {
  const dt = Math.min(0.1, (t - lastT) / 1000 || 0); lastT = t; acc += dt;
  pollGamepad();
  while (acc >= 1 / 60) { step(); acc -= 1 / 60; }
  alpha = S.mode === 'play' ? acc * 60 : 1;
  render();
  requestAnimationFrame(frame);
}
loadRoom(0, 0, 'start');
const q = new URLSearchParams(location.search);
if (q.has('set')) { const i = Math.max(0, Math.min(STAGES.length - 1, (+q.get('set') || 1) - 1)); startStage(i); if (q.has('room')) { loadRoom(i, Math.max(0, Math.min(2, (+q.get('room') || 1) - 1)), null); restartRoom(true); } }
else setMode('title');
requestAnimationFrame(frame);

// test hooks
window.TL = { S, STAGES, keys, press, release, step, sim(n) { for (let i = 0; i < n; i++) step(); }, startStage, loadRoom, restartRoom, setMode, fireWeb, trace };
</script>
</body>
</html>
