<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Dead Drop</title>
<style>
  :root { --bg: #f4f2ec; --card: #fff; --ink: #222; --mute: #666; --line: #d8d4ca; --acc: #b0302a; }
  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; background: var(--bg); color: var(--ink); font-family: system-ui, -apple-system, Segoe UI, sans-serif; overflow: hidden; touch-action: manipulation; }
  #wrap { position: fixed; inset: 0; display: flex; flex-direction: column; align-items: center; justify-content: center; }
  #c { display: block; background: #2b2a33; border-radius: 6px; box-shadow: 0 2px 12px rgba(0,0,0,.18); image-rendering: auto; }
  #ui { position: fixed; inset: 0; display: flex; align-items: center; justify-content: center; padding: 16px; background: rgba(244,242,236,.92); overflow: auto; }
  #ui.hide { display: none; }
  .card { background: var(--card); border: 1px solid var(--line); border-radius: 10px; padding: 22px 24px; width: min(460px, 100%); max-height: 100%; overflow: auto; box-shadow: 0 4px 20px rgba(0,0,0,.08); }
  .card.wide { width: min(640px, 100%); }
  h1 { margin: 0; font-size: 2rem; letter-spacing: .02em; }
  h1 small { display: block; font-size: .9rem; color: var(--mute); font-weight: 500; letter-spacing: 0; margin-top: 2px; }
  h2 { margin: 0 0 12px; font-size: 1.3rem; }
  h3 { margin: 16px 0 6px; font-size: 1rem; }
  p, li { color: #444; line-height: 1.45; font-size: .95rem; }
  .btns { display: grid; gap: 8px; margin: 18px 0 8px; }
  button { font: inherit; font-weight: 600; padding: 11px 14px; border-radius: 8px; border: 1px solid #c9c4b8; background: #fbfaf7; color: var(--ink); cursor: pointer; }
  button:hover { border-color: #888; }
  button.pri { background: var(--acc); border-color: var(--acc); color: #fff; }
  button.sm { padding: 6px 10px; font-size: .85rem; }
  .row { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; margin: 8px 0; }
  .row label { min-width: 96px; color: var(--mute); font-size: .9rem; }
  .seg { display: inline-flex; border: 1px solid #c9c4b8; border-radius: 8px; overflow: hidden; }
  .seg button { border: 0; border-radius: 0; padding: 7px 11px; font-weight: 500; background: #fbfaf7; }
  .seg button + button { border-left: 1px solid #c9c4b8; }
  .seg button.on { background: #2b2a33; color: #fff; }
  input[type=text], textarea { font: inherit; padding: 9px 10px; border: 1px solid #c9c4b8; border-radius: 8px; background: #fff; color: var(--ink); width: 100%; }
  textarea { height: 76px; font-family: ui-monospace, monospace; font-size: .75rem; }
  .code { font: 700 2rem ui-monospace, monospace; letter-spacing: .2em; text-align: center; padding: 8px; background: #f4f2ec; border-radius: 8px; }
  .note { font-size: .82rem; color: var(--mute); }
  .err { color: #b0302a; font-size: .9rem; min-height: 1.2em; }
  .score { font-size: .9rem; color: var(--mute); text-align: center; }
  table { border-collapse: collapse; width: 100%; font-size: .85rem; }
  td, th { border-bottom: 1px solid #eee; padding: 5px 6px; text-align: left; vertical-align: top; }
  th { color: var(--mute); font-weight: 600; }
  details { margin-top: 12px; }
  summary { cursor: pointer; color: var(--mute); font-size: .9rem; }
  #toast { position: fixed; left: 50%; top: 14px; transform: translateX(-50%); background: #fff; border: 1px solid var(--line); padding: 8px 14px; border-radius: 8px; font-size: .9rem; box-shadow: 0 2px 10px rgba(0,0,0,.12); opacity: 0; transition: opacity .25s; pointer-events: none; z-index: 9; }
  #toast.on { opacity: 1; }
  #pauseBtn { position: fixed; top: 8px; right: 8px; z-index: 3; padding: 6px 10px; opacity: .85; }
  #touch { display: none; width: 100%; max-width: 640px; height: 170px; position: relative; user-select: none; -webkit-user-select: none; flex: none; }
  .touch #touch { display: block; }
  #stick { position: absolute; left: 18px; bottom: 14px; width: 140px; height: 140px; border-radius: 50%; background: #e7e3d8; border: 1px solid #cfc9bb; touch-action: none; }
  #knob { position: absolute; left: 45px; top: 45px; width: 50px; height: 50px; border-radius: 50%; background: #fff; border: 1px solid #aaa; pointer-events: none; }
  .tb { position: absolute; width: 74px; height: 74px; border-radius: 50%; display: flex; align-items: center; justify-content: center; font-weight: 700; font-size: .85rem; background: #fff; border: 1px solid #bbb; touch-action: none; }
  .tb.on { background: #2b2a33; color: #fff; }
  #tA { right: 18px; bottom: 54px; background: #fbe9e7; }
  #tT { right: 102px; bottom: 18px; }
  #tC { right: 102px; bottom: 100px; width: 56px; height: 56px; }
</style>
</head>
<body>
<div id="wrap">
  <canvas id="c" width="640" height="600"></canvas>
  <div id="touch">
    <div id="stick"><div id="knob"></div></div>
    <div class="tb" id="tA" data-k="a">Search</div>
    <div class="tb" id="tT" data-k="t">Trap</div>
    <div class="tb" id="tC" data-k="c">Next</div>
  </div>
</div>
<button id="pauseBtn" class="sm" hidden>Pause</button>
<div id="ui"></div>
<div id="toast"></div>
<script>
"use strict";
// ================================================================ Dead Drop: a Spy vs Spy remake
// Two spies search a procedurally built embassy for four documents and a briefcase, then race for the exit door.
// Everything is drawn and synthesised here; the embassy, furniture and items change every round.

// ---------------------------------------------------------------- utils
const clamp = (v, a, b) => v < a ? a : v > b ? b : v;
const lerp = (a, b, t) => a + (b - a) * t;
const rnd = n => Math.floor(Math.random() * n);
function rng(seed) { // mulberry32: worlds are rebuilt from a seed so online guests can make the same embassy
  let a = seed >>> 0;
  const f = () => { a = (a + 0x6D2B79F5) >>> 0; let t = a; t = Math.imul(t ^ (t >>> 15), t | 1); t ^= t + Math.imul(t ^ (t >>> 7), t | 61); return ((t ^ (t >>> 14)) >>> 0) / 4294967296; };
  f.int = n => Math.floor(f() * n); f.pick = arr => arr[f.int(arr.length)];
  f.shuffle = arr => { for (let i = arr.length - 1; i > 0; i--) { const j = f.int(i + 1); [arr[i], arr[j]] = [arr[j], arr[i]]; } return arr; };
  return f;
}
const Store = {
  get(k, d) { try { const v = localStorage.getItem("deaddrop." + k); return v == null ? d : JSON.parse(v); } catch (e) { return d; } },
  set(k, v) { try { localStorage.setItem("deaddrop." + k, JSON.stringify(v)); } catch (e) {} },
};
const fmtClock = t => { t = Math.max(0, Math.ceil(t)); return Math.floor(t / 60) + ":" + String(t % 60).padStart(2, "0"); };

// ---------------------------------------------------------------- items and traps
const OBJ = ["pass", "cash", "key", "plans"];             // the four documents; the briefcase ("case") carries them
const REM = ["bucket", "cutter", "umbrella", "scissors"];  // remedies
const TRAPS = ["bomb", "spring", "water", "gun", "time"];
const TRAP_AT = { bomb: "furn", spring: "furn", water: "door", gun: "door", time: "room" };
const CURE = { bomb: "bucket", spring: "cutter", water: "umbrella", gun: "scissors" };
const TRAP_N = { bomb: 2, spring: 2, water: 2, gun: 2, time: 1 };
const NAME = { case: "briefcase", pass: "passport", cash: "cash", key: "key", plans: "plans", bucket: "water bucket", cutter: "wire cutters", umbrella: "umbrella", scissors: "scissors",
  bomb: "bomb", spring: "spring", water: "bucket on a door", gun: "gun on a string", time: "time bomb" };
const isObj = k => OBJ.includes(k);
const SIZES = { small: [3, 3], medium: [4, 3], large: [5, 4] };
const SPY = [{ name: "White", coat: "#f5f4ef", dark: "#1a1a1a", trim: "#c9c6bd", ui: "#e9e6dc" }, { name: "Black", coat: "#2a2a30", dark: "#000", trim: "#55555e", ui: "#3a3a42" }];

// ---------------------------------------------------------------- room geometry
// Each room is a 10 x 6 floor (x across, z from back wall to front) with 4-unit walls, seen from the front and above.
const FW = 10, FD = 6, WALLH = 4;
const DOORS = { n: { x: 5, z: 0, dx: 0, dz: -1 }, s: { x: 5, z: FD, dx: 0, dz: 1 }, w: { x: 0, z: 3, dx: -1, dz: 0 }, e: { x: FW, z: 3, dx: 1, dz: 0 } };
const OPP = { n: "s", s: "n", e: "w", w: "e" };
const ARRIVE = { n: [5, 5.35], s: [5, 0.75], w: [9.2, 3], e: [0.8, 3] }; // where you appear after leaving through a door
// Furniture slots: four on the back wall (the north door sits between them), two on each side wall.
const SLOTS = [
  { wall: "n", c: 1.5 }, { wall: "n", c: 3.35 }, { wall: "n", c: 6.65 }, { wall: "n", c: 8.5 },
  { wall: "w", c: 1.35 }, { wall: "w", c: 4.65 }, { wall: "e", c: 1.35 }, { wall: "e", c: 4.65 },
];
// w: width along the wall, d: depth into the room, h: height. "pic" hangs on the wall.
const FURN = {
  desk: { w: 1.8, d: 0.9, h: 1.2 }, shelf: { w: 1.6, d: 0.55, h: 3.0 }, cabinet: { w: 0.95, d: 0.8, h: 2.0 }, sofa: { w: 1.8, d: 1.0, h: 1.3 },
  tv: { w: 1.1, d: 0.8, h: 1.75 }, safe: { w: 1.0, d: 0.9, h: 1.3 }, plant: { w: 0.8, d: 0.8, h: 1.9 }, chest: { w: 1.5, d: 0.75, h: 0.95 },
  clock: { w: 0.75, d: 0.5, h: 3.2 }, pic: { w: 1.3, d: 0, h: 1.1 },
};
const CLASH = { 0: 4, 4: 0, 3: 6, 6: 3 }; // corner slots that would overlap
const SIDE_OK = ["desk", "shelf", "cabinet", "sofa", "tv", "safe", "plant", "chest", "clock"];
function footprint(slot, k) {
  const f = FURN[k], hw = f.w / 2;
  if (slot.wall === "n") return { x0: slot.c - hw, x1: slot.c + hw, z0: 0, z1: f.d };
  if (slot.wall === "w") return { x0: 0, x1: f.d, z0: slot.c - hw, z1: slot.c + hw };
  return { x0: FW - f.d, x1: FW, z0: slot.c - hw, z1: slot.c + hw };
}
function searchPoint(slot, k) {
  const f = FURN[k];
  if (slot.wall === "n") return [slot.c, (k === "pic" ? 0 : f.d) + 0.5];
  if (slot.wall === "w") return [f.d + 0.45, slot.c];
  return [FW - f.d - 0.45, slot.c];
}

const WALLS = ["#e9dcc4", "#d9e4d2", "#d6dfe8", "#eed9d3", "#e6e0ef", "#efe6c8", "#d4e6e2", "#e8d8e2", "#dcd7cc"];
const FLOORS = [["#b9895c", "#a97b50"], ["#c9c3b4", "#b5ae9e"], ["#8e9c86", "#7f8d78"], ["#b4a28a", "#a3917a"], ["#9fb0bd", "#8fa0ad"], ["#c4a07a", "#b58f69"]];
const WOODS = ["#8a5a36", "#6d4a30", "#a06b3f", "#7b6a58", "#5d6a73", "#8c7a5b"];

// ---------------------------------------------------------------- embassy generator
function genWorld(seed, sizeKey) {
  const R = rng(seed), [GW, GH] = SIZES[sizeKey] || SIZES.medium, N = GW * GH;
  const rooms = [];
  for (let i = 0; i < N; i++) rooms.push({ i, gx: i % GW, gy: Math.floor(i / GW), doors: { n: -1, s: -1, e: -1, w: -1 }, exit: null, furn: [], floor: [], bomb: null, dopen: { n: 0, s: 0, e: 0, w: 0 } });
  const nb = (r, d) => { const x = r.gx + DOORS[d].dx, y = r.gy + DOORS[d].dz; return x < 0 || y < 0 || x >= GW || y >= GH ? -1 : y * GW + x; };
  const link = (a, d) => { const b = nb(rooms[a], d); rooms[a].doors[d] = b; rooms[b].doors[OPP[d]] = a; };
  // randomised depth-first spanning tree, then a few extra doors so there are loops to run around
  const seen = new Set([0]), stack = [0];
  while (stack.length) {
    const a = stack[stack.length - 1], opts = R.shuffle(["n", "s", "e", "w"]).filter(d => { const b = nb(rooms[a], d); return b >= 0 && !seen.has(b); });
    if (!opts.length) { stack.pop(); continue; }
    const d = opts[0], b = nb(rooms[a], d); link(a, d); seen.add(b); stack.push(b);
  }
  for (const r of rooms) for (const d of ["e", "s"]) { const b = nb(r, d); if (b >= 0 && r.doors[d] < 0 && R() < 0.33) link(r.i, d); }
  const dist = from => { const D = new Array(N).fill(1e9); D[from] = 0; const q = [from]; while (q.length) { const a = q.shift(); for (const d in rooms[a].doors) { const b = rooms[a].doors[d]; if (b >= 0 && D[b] > D[a] + 1) { D[b] = D[a] + 1; q.push(b); } } } return D; };
  // starts: two rooms far apart
  let a = R.int(N); for (let k = 0; k < 2; k++) { const D = dist(a); a = D.indexOf(Math.max(...D)); }
  const s0 = a, D0 = dist(s0), s1 = D0.indexOf(Math.max(...D0)), D1 = dist(s1);
  // exit: an outer room about as far from both spies, on a wall with nothing behind it
  let best = null;
  for (const r of rooms) for (const d of ["n", "s", "e", "w"]) {
    if (nb(r, d) >= 0 || r.i === s0 || r.i === s1) continue;
    const sc = Math.abs(D0[r.i] - D1[r.i]) * 10 - (D0[r.i] + D1[r.i]) + R() * 2;
    if (!best || sc < best.sc) best = { sc, r: r.i, d };
  }
  rooms[best.r].exit = best.d;
  // furniture: 3 to 5 pieces per room, never in front of a door
  for (const r of rooms) {
    const order = R.shuffle(SLOTS.map((s, i) => i)), used = [], n = 3 + R.int(3), wall = WALLS[R.int(WALLS.length)];
    for (const i of order) if (used.length < n && !used.some(j => CLASH[j] === i)) used.push(i);
    r.wall = wall; r.floorCol = FLOORS[R.int(FLOORS.length)]; r.pattern = R.int(3);
    let pics = 0;
    for (const si of used) {
      const slot = SLOTS[si];
      let k = slot.wall === "n" ? R.pick(["desk", "shelf", "cabinet", "sofa", "tv", "safe", "plant", "chest", "clock", "pic"]) : R.pick(SIDE_OK);
      if (k === "pic" && pics++) k = "cabinet";
      const fp = footprint(slot, k), sp = searchPoint(slot, k);
      r.furn.push({ k, slot: si, wall: slot.wall, c: slot.c, fp, sx: sp[0], sz: sp[1], col: R.pick(WOODS), seed: R.int(1e6), items: [], trap: null, open: 0 });
    }
    r.furn.sort((p, q) => p.slot - q.slot);
  }
  // hide the briefcase and the documents in five different rooms, balanced so neither start is favoured
  let bestP = null;
  for (let t = 0; t < 60; t++) {
    const cand = R.shuffle(rooms.map(r => r.i).filter(i => i !== s0 && i !== s1)).slice(0, 5);
    if (cand.length < 5) { while (cand.length < 5) cand.push(R.int(N)); }
    const sc = Math.abs(cand.reduce((s, i) => s + D0[i] - D1[i], 0)) + R();
    if (!bestP || sc < bestP.sc) bestP = { sc, cand };
  }
  ["case", ...OBJ].forEach((k, j) => { const r = rooms[bestP.cand[j]], f = r.furn.filter(f => !f.items.length); (f.length ? R.pick(f) : R.pick(r.furn)).items.push(k); });
  // remedies lie about in plain sight, one of each per four rooms or so
  const per = Math.max(1, Math.round(N / 4));
  for (const k of REM) for (let j = 0; j < per; j++) placeFloor(rooms[R.int(N)], k, R);
  return { seed, size: sizeKey, GW, GH, rooms, starts: [s0, s1], exitRoom: best.r };
}
function openSpot(r, R) {
  for (let t = 0; t < 40; t++) {
    const x = 1.6 + R() * 6.8, z = 1.9 + R() * 3.2;
    if (Math.abs(x - 5) < 0.9 && z > 4.6) continue;
    if (r.furn.some(f => x > f.fp.x0 - 0.5 && x < f.fp.x1 + 0.5 && z > f.fp.z0 - 0.5 && z < f.fp.z1 + 0.6)) continue;
    if (r.floor.some(it => Math.hypot(it.x - x, it.z - z) < 1)) continue;
    return [x, z];
  }
  return [3 + R() * 4, 3.5];
}
function placeFloor(r, k, R = Math.random) { const [x, z] = openSpot(r, R); r.floor.push({ k, x, z }); }

// ---------------------------------------------------------------- the game
const SPEED_X = 3.3, SPEED_Z = 2.5, DIE_PENALTY = 15, RESPAWN = 5;
class Game {
  constructor(opt) {
    this.opt = opt; this.seed = opt.seed ?? ((Math.random() * 2 ** 31) >>> 0);
    this.w = genWorld(this.seed, opt.size); this.rooms = this.w.rooms;
    this.t = 0; this.over = false; this.winner = -1; this.why = ""; this.overT = 0;
    this.doorTraps = {}; this.fx = []; this.ev = []; this.netEv = [];
    this.spies = [0, 1].map(i => this.newSpy(i, opt.time));
    this.ai = [null, null];
  }
  newSpy(i, time) {
    const r = this.w.starts[i];
    return { i, name: SPY[i].name, room: r, x: i ? 6.4 : 3.6, z: 3.6, face: i ? -1 : 1, st: "idle", stT: 0, an: 0, hp: 100, hitT: 9, clock: time, inv: 0,
      hand: null, case: false, bag: [], traps: { ...TRAP_N }, sel: 0, msg: "", msgT: 0, cause: "", out: false, won: false, doorCD: 0, tgt: null, deaths: 0, kills: 0,
      seen: { [r]: 1 }, last: { a: 0, t: 0, c: 0 } };
  }
  say(s, m, t = 2.2) { s.msg = m; s.msgT = t; }
  sfx(k, r) { this.ev.push(k); this.netEv.push(k); }
  edge(r, d) { const b = this.rooms[r].doors[d]; return Math.min(r, b) + "-" + Math.max(r, b); }
  other(s) { return this.spies[1 - s.i]; }
  solid(r, x, z, s) {
    if (x < 0.35 || x > FW - 0.35 || z < 0.32 || z > FD - 0.28) return true;
    for (const f of this.rooms[r].furn) { if (f.k === "pic") continue; const p = f.fp; if (x > p.x0 - 0.28 && x < p.x1 + 0.28 && z > p.z0 - 0.15 && z < p.z1 + 0.15) return true; }
    return false;
  }
  move(s, dx, dz) {
    if (dx && !this.solid(s.room, s.x + dx, s.z, s)) s.x += dx;
    if (dz && !this.solid(s.room, s.x, s.z + dz, s)) s.z += dz;
  }
  nearFurn(s, reach = 0.95) {
    let best = null, bd = reach;
    for (const f of this.rooms[s.room].furn) { const d = Math.hypot(f.sx - s.x, (f.sz - s.z) * 1.3); if (d < bd) { bd = d; best = f; } }
    return best;
  }
  nearDoor(s, reach = 1.6) {
    let best = null, bd = reach; const r = this.rooms[s.room];
    for (const d in DOORS) { if (r.doors[d] < 0) continue; const D = DOORS[d], px = clamp(D.x, 0.5, FW - 0.5), pz = clamp(D.z, 0.5, FD - 0.5), dd = Math.hypot(px - s.x, pz - s.z); if (dd < bd) { bd = dd; best = d; } }
    return best;
  }
  alive(s) { return !s.out && !s.won && s.st !== "dead"; }

  step(dt, inputs) {
    if (this.over) { this.overT += dt; for (const s of this.spies) s.msgT -= dt; this.tickFx(dt); return; }
    this.t += dt;
    for (const s of this.spies) {
      const ai = this.ai[s.i]; const inp = ai ? ai.update(dt) : (inputs[s.i] || { x: 0, y: 0, a: 0, t: 0, c: 0 });
      this.updateSpy(s, inp, dt);
    }
    for (const r of this.rooms) {
      for (const f of r.furn) f.open = Math.max(0, f.open - dt);
      for (const d in r.dopen) r.dopen[d] = Math.max(0, r.dopen[d] - dt);
      if (r.bomb) {
        const b = r.bomb, before = Math.ceil(b.t); b.t -= dt;
        if (Math.ceil(b.t) !== before && b.t > 0) this.sfx("tick", r.i);
        if (b.t <= 0) {
          r.bomb = null; this.fx.push({ k: "blast", room: r.i, x: b.x, z: b.z, t: 0 }); this.sfx("boom", r.i);
          for (const s of this.spies) if (s.room === r.i && this.alive(s)) this.kill(s, "blast", b.o);
        }
      }
    }
    this.tickFx(dt);
    const [a, b] = this.spies;
    if (a.won || b.won) { this.end(a.won ? 0 : 1, (a.won ? a : b).name + " escaped with the briefcase!"); }
    else if (a.out && b.out) this.end(-1, "Both spies ran out of time.");
  }
  tickFx(dt) { for (const f of this.fx) f.t += dt; this.fx = this.fx.filter(f => f.t < 1.6); }
  end(w, why) { this.over = true; this.winner = w; this.why = why; this.sfx(w >= 0 ? "win" : "lose"); }

  updateSpy(s, inp, dt) {
    if (s.won) return;
    s.msgT -= dt; s.inv -= dt; s.hitT += dt; s.doorCD -= dt;
    // presses arrive as counters so a quick tap between frames (or network packets) is never lost
    const pr = {}; for (const k of ["a", "t", "c"]) { pr[k] = (inp[k] | 0) !== s.last[k]; s.last[k] = inp[k] | 0; }
    if (s.out) return;
    if (s.st !== "dead") { s.clock -= dt; if (s.clock <= 0) { s.clock = 0; s.out = true; s.st = "out"; this.say(s, "Out of time", 99); this.sfx("lose"); this.dropAll(s); return; } }
    if (s.hitT > 3 && s.hp < 100 && s.st !== "dead") s.hp = Math.min(100, s.hp + dt * 6);
    s.stT += dt;
    switch (s.st) {
      case "dead": if (s.stT > RESPAWN) this.respawn(s); return;

    for (const s of g.spies) {
      if (s.tx == null) continue;
      const k = Math.min(1, dt * 14); s.x += (s.tx - s.x) * k; s.z += (s.tz - s.z) * k; s.dx = s.x; s.dz = s.z;
      s.msgT -= dt; if (s.st === "dead" || s.st === "search" || s.st === "set" || s.st === "swing" || s.st === "hurt") s.stT += dt;
    }
    for (const r of g.rooms) if (r.bomb) r.bomb.t -= dt;
    if (g.over) g.overT += dt;
    for (const f of g.fx) f.t += dt;
    const i = inputFor(0, pads()), key = JSON.stringify(i), now = performance.now();
    if (key !== this.sentIn || now - this.sentAt > 250) { this.send({ t: "in", i }); this.sentIn = key; this.sentAt = now; }
  },
};

// ---------------------------------------------------------------- app, screens and the main loop
const cv = document.getElementById("c"), ctx = cv.getContext("2d"), ui = document.getElementById("ui"), pauseBtn = document.getElementById("pauseBtn");
const App = {
  screen: "menu", mode: null, game: null, views: [0, 1], paused: false, overShown: false, demo: null,
  opt: Object.assign({ size: "medium", time: 300, cpu: "normal" }, Store.get("opt", {})), tally: [0, 0], hostOpt: null,
  begin(mode, o) {
    this.mode = mode; this.paused = false; this.overShown = false;
    const g = new Game({ seed: o.seed, size: o.size || this.opt.size, time: o.time || this.opt.time });
    if (mode === "solo") g.ai[1] = new AI(g, 1, this.opt.cpu);
    if (mode === "demo") { g.ai[0] = new AI(g, 0, "hard"); g.ai[1] = new AI(g, 1, "hard"); }
    this.game = g; cnt.forEach(c => { c.a = c.t = c.c = 0; }); for (const s of g.spies) s.last = { a: 0, t: 0, c: 0 };
    Online.netIn = { x: 0, y: 0, a: 0, t: 0, c: 0 };
    this.views = mode === "client" ? [1, 0] : [0, 1];
    this.views.label = mode === "solo" ? ["YOU", "CPU"] : mode === "host" ? ["YOU", (Online.members[1] || "GUEST").toUpperCase()] : mode === "client" ? ["YOU", (Online.members[0] || "HOST").toUpperCase()] : ["PLAYER 1", "PLAYER 2"];
    this.screen = "play"; UI.hide(); pauseBtn.hidden = false; Sfx.init(); Music.start();
  },
  toMenu() { this.screen = "menu"; this.game = null; this.mode = null; pauseBtn.hidden = true; Music.stop(); UI.menu(); },
};
function togglePause() {
  if (App.screen !== "play" || !App.game || App.game.over) return;
  if (App.paused) { App.paused = false; UI.hide(); } else { App.paused = true; UI.pause(); }
}
pauseBtn.onclick = () => togglePause();
let toastT = null;
function toast(m) { const t = document.getElementById("toast"); t.textContent = m; t.classList.add("on"); clearTimeout(toastT); toastT = setTimeout(() => t.classList.remove("on"), 2600); }
const esc = s => String(s).replace(/[&<>"]/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]));
function seg(id, opts, cur) { return `<span class="seg" id="${id}">` + opts.map(([v, l]) => `<button data-v="${v}" class="${String(v) === String(cur) ? "on" : ""}">${l}</button>`).join("") + "</span>"; }
function bindSeg(id, f) { const el = document.getElementById(id); if (!el) return; el.onclick = e => { const b = e.target.closest("button"); if (!b) return; el.querySelectorAll("button").forEach(x => x.classList.toggle("on", x === b)); f(b.dataset.v); }; }
function saveOpt() { Store.set("opt", App.opt); }
const UI = {
  show(html, wide) { ui.innerHTML = `<div class="card${wide ? " wide" : ""}">${html}</div>`; ui.classList.remove("hide"); },
  hide() { ui.classList.add("hide"); ui.innerHTML = ""; },
  settings(online) {
    return `<div class="row"><label>Embassy</label>${seg("oSize", [["small", "Small"], ["medium", "Medium"], ["large", "Large"]], App.opt.size)}</div>
      <div class="row"><label>Clock</label>${seg("oTime", [[180, "3 min"], [300, "5 min"], [480, "8 min"]], App.opt.time)}</div>` +
      (online ? "" : `<div class="row"><label>Computer</label>${seg("oCpu", [["easy", "Easy"], ["normal", "Normal"], ["hard", "Hard"]], App.opt.cpu)}</div>`);
  },
  bindSettings(after) {
    bindSeg("oSize", v => { App.opt.size = v; saveOpt(); after && after(); });
    bindSeg("oTime", v => { App.opt.time = +v; saveOpt(); after && after(); });
    bindSeg("oCpu", v => { App.opt.cpu = v; saveOpt(); });
  },
  menu() {
    App.screen = "menu";
    const t = App.tally;
    this.show(`<h1>Dead Drop<small>a Spy vs Spy remake</small></h1>
      <p>Two spies, one embassy, a new floor plan every round. Find the briefcase and four documents, rig the furniture and doors for your rival, then get out through the exit before your clock runs down.</p>
      <div class="btns">
        <button class="pri" id="bSolo">Play against the computer</button>
        <button id="bLocal">Two players, one keyboard</button>
        <button id="bOnline">Play online</button>
        <button id="bHelp">How to play</button>
      </div>
      ${this.settings()}
      <div class="row"><label>Sound</label>${seg("oSnd", [[1, "On"], [0, "Off"]], Sfx.on ? 1 : 0)} ${seg("oMus", [[1, "Music"], [0, "No music"]], Sfx.music ? 1 : 0)}</div>
      ${t[0] + t[1] ? `<p class="score">This session: White ${t[0]}, Black ${t[1]}</p>` : ""}`);
    this.bindSettings();
    bindSeg("oSnd", v => { Sfx.on = v === "1"; Store.set("sound", Sfx.on); });
    bindSeg("oMus", v => { Sfx.music = v === "1"; Store.set("music", Sfx.music); });
    document.getElementById("bSolo").onclick = () => App.begin("solo", {});
    document.getElementById("bLocal").onclick = () => App.begin("local", {});
    document.getElementById("bOnline").onclick = () => this.online();
    document.getElementById("bHelp").onclick = () => this.help();
  },
  help() {
    this.show(`<h2>How to play</h2>
      <p>Each spy has a clock. Search furniture to find the <b>briefcase</b>, the <b>passport</b>, the <b>cash</b>, the <b>key</b> and the <b>plans</b>. Without the briefcase you can carry only one thing. With it, documents go inside and your hand is free. Then walk out through the green <b>EXIT</b> door. The map in your panel shows the exit and where you are.</p>
      <p>Rig furniture or doors with traps from your trapulator. Whoever searches that furniture or opens that door next (you included) is caught, unless they hold the cure. Your own traps blink faintly on your screen only. Falling costs 15 seconds and drops everything you carried into the room's furniture.</p>
      <table><tr><th>Trap</th><th>Set on</th><th>Cure in hand</th></tr>
      <tr><td>Bomb</td><td>furniture</td><td>water bucket</td></tr><tr><td>Spring</td><td>furniture</td><td>wire cutters</td></tr>
      <tr><td>Bucket on a door</td><td>door</td><td>umbrella</td></tr><tr><td>Gun on a string</td><td>door</td><td>scissors</td></tr>
      <tr><td>Time bomb</td><td>the floor, 10 s</td><td>leave the room</td></tr></table>
      <p>Cures lie on the floor; walk over and press search to pick one up. Meet your rival and you can fight with clubs.</p>
      <h3>Controls</h3>
      <table><tr><th></th><th>Move</th><th>Search / fight</th><th>Set trap</th><th>Next trap</th></tr>
      <tr><td>Solo or online</td><td>WASD or arrows</td><td>F, Space, Enter</td><td>G, E, /</td><td>R, Q, ,</td></tr>
      <tr><td>Player 1</td><td>WASD</td><td>F or Space</td><td>G or E</td><td>R or Q</td></tr>
      <tr><td>Player 2</td><td>arrows</td><td>Enter or .</td><td>/ or Right Shift</td><td>, or Right Ctrl</td></tr>
      <tr><td>Gamepad</td><td>stick or d-pad</td><td>A</td><td>X</td><td>B or Y</td></tr></table>
      <p class="note">Esc or P pauses. On a phone, use the stick and buttons under the screen.</p>
      <div class="btns"><button class="pri" id="bBack">Back</button></div>`, true);
    document.getElementById("bBack").onclick = () => this.menu();
  },
  online(err) {
    App.screen = "online";
    const code = qs.get("room") || "";
    this.show(`<h2>Play online</h2>
      <div class="row"><label>Your name</label><input type="text" id="nm" maxlength="14" value="${esc(Online.name)}" placeholder="Agent"></div>
      <div class="btns"><button class="pri" id="bCreate">Create a room</button></div>
      <div class="row"><input type="text" id="jc" maxlength="5" placeholder="Room code" value="${esc(code)}" style="flex:1;text-transform:uppercase"><button id="bJoin">Join</button></div>
      <p class="err" id="err">${esc(err || "")}</p>
      <details><summary>Can't connect? Swap codes by hand</summary>
        <p class="note">Host: make an invite and send it to your friend. Friend: paste it below to get a reply code and send that back.</p>
        <div class="btns"><button id="bInv">Make an invite (host)</button></div>
        <textarea id="mt" placeholder="Paste a code here"></textarea>
        <div class="row"><button id="bAns">Answer an invite (guest)</button><button id="bAcc">Accept a reply (host)</button></div>
      </details>
      <p class="note">Rooms use a free public signalling server only to introduce the two browsers; the game goes peer to peer. Some strict networks block direct connections. Keep the host's tab in front: browsers slow down background tabs.</p>
      <div class="btns"><button id="bBack">Back</button></div>`);
    const nm = document.getElementById("nm"), er = document.getElementById("err"), mt = document.getElementById("mt");
    const nameOk = () => { Online.name = nm.value.trim().slice(0, 14) || "Agent"; Store.set("name", Online.name); };
    const busy = (b, t) => { b.disabled = true; const o = b.textContent; b.textContent = t; return () => { b.disabled = false; b.textContent = o; }; };
    document.getElementById("bCreate").onclick = async e => { nameOk(); const done = busy(e.target, "Opening..."); try { await Online.createRoom(); App.screen = "lobby"; this.lobby(); } catch (x) { done(); er.textContent = x.message + " Try the hand-swap option below."; } };
    document.getElementById("bJoin").onclick = async e => { nameOk(); const c = document.getElementById("jc").value.trim(); if (c.length < 5) { er.textContent = "Room codes have five characters."; return; } const done = busy(e.target, "Joining..."); try { await Online.join(c); } catch (x) { done(); Online.reset(); er.textContent = x.message; } };
    document.getElementById("bInv").onclick = async () => { nameOk(); try { mt.value = await Online.manualInvite(); mt.select(); er.textContent = "Invite ready: copy it to your friend, then paste their reply and press Accept."; } catch (x) { er.textContent = x.message; } };
    document.getElementById("bAns").onclick = async () => { nameOk(); try { mt.value = await Online.manualAnswer(mt.value); mt.select(); er.textContent = "Reply ready: send it back to the host."; } catch (x) { er.textContent = "That invite code didn't work."; } };
    document.getElementById("bAcc").onclick = async () => { try { await Online.manualAccept(mt.value); er.textContent = "Connecting..."; } catch (x) { er.textContent = x.message || "That reply code didn't work."; } };
    document.getElementById("bBack").onclick = () => { Online.reset(); this.menu(); };
    if (code && !this.autoJoined) { this.autoJoined = true; if (!Online.name) Online.name = "Agent"; document.getElementById("bJoin").click(); }
  },
  lobby() {
    App.screen = "lobby";
    const host = Online.role === "host", m = Online.members, link = Online.code ? location.origin + location.pathname + "?room=" + Online.code + (qs.get("broker") ? "&broker=" + encodeURIComponent(qs.get("broker")) : "") : "";
    const o = host ? App.opt : (App.hostOpt || App.opt);
    this.show(`<h2>Room</h2>
      ${Online.code ? `<div class="code">${Online.code}</div><div class="row" style="justify-content:center"><button class="sm" id="bCopy">Copy invite link</button></div>` : `<p class="note">Connected by hand-swapped codes.</p>`}
      <table><tr><th>White</th><td>${esc(m[0] || "")}${host ? " (you)" : ""}</td></tr><tr><th>Black</th><td>${m[1] ? esc(m[1]) + (host ? "" : " (you)") : "<span class='note'>waiting for a friend...</span>"}</td></tr></table>
      ${host ? this.settings(true) : `<p class="note">Embassy: ${o.size}, clock: ${o.time / 60} min. The host starts the match.</p>`}
      <div class="btns">${host ? `<button class="pri" id="bStart" ${m[1] ? "" : "disabled"}>Start</button>` : ""}<button id="bLeave">Leave</button></div>`);
    if (host) { this.bindSettings(() => Online.lobby()); document.getElementById("bStart").onclick = () => Online.start(); }
    const cp = document.getElementById("bCopy"); if (cp) cp.onclick = () => { (navigator.clipboard ? navigator.clipboard.writeText(link) : Promise.reject()).then(() => toast("Invite link copied"), () => prompt("Invite link", link)); };
    document.getElementById("bLeave").onclick = () => { if (Online.role === "host") Online.send({ t: "bye", why: "The host closed the room." }); Online.reset(); this.menu(); };
  },
  pause() {
    const net = App.mode === "host" || App.mode === "client";
    this.show(`<h2>${net ? "Menu" : "Paused"}</h2>${net ? `<p class="note">Online games keep running.</p>` : ""}
      <div class="btns"><button class="pri" id="bRes">Resume</button><button id="bQuit">${net ? "Leave the match" : "Quit to menu"}</button></div>`);
    document.getElementById("bRes").onclick = () => togglePause();
    document.getElementById("bQuit").onclick = () => { if (net) { if (Online.role === "host") Online.send({ t: "bye", why: "The host left." }); Online.reset(); } App.toMenu(); };
  },
  over(g) {
    const net = App.mode === "host" || App.mode === "client", me = App.mode === "client" ? 1 : 0;
    const won = g.winner, title = won < 0 ? "Nobody escaped" : App.mode === "solo" || net ? (won === me ? "You escaped!" : "Your rival escaped") : SPY[won].name + " wins";
    const s = g.spies;
    this.show(`<h2>${title}</h2><p>${esc(g.why)}</p>
      <table><tr><th></th><th>White</th><th>Black</th></tr>
      <tr><td>Clock left</td><td>${fmtClock(s[0].clock)}</td><td>${fmtClock(s[1].clock)}</td></tr>
      <tr><td>Rival knocked out</td><td>${s[0].kills}</td><td>${s[1].kills}</td></tr>
      <tr><td>Falls</td><td>${s[0].deaths}</td><td>${s[1].deaths}</td></tr></table>
      <p class="score">This session: White ${App.tally[0]}, Black ${App.tally[1]}</p>
      <div class="btns">${App.mode === "client" ? `<p class="note">Waiting for the host to start another round...</p>` : `<button class="pri" id="bAgain">New embassy</button>`}<button id="bMenu">${net ? "Leave" : "Menu"}</button></div>`);
    const ag = document.getElementById("bAgain");
    if (ag) ag.onclick = () => { if (App.mode === "host") { if (Online.peer) Online.start(); else App.begin("solo", {}); } else App.begin(App.mode, {}); };
    document.getElementById("bMenu").onclick = () => { if (net) { if (Online.role === "host") Online.send({ t: "bye", why: "The host left." }); Online.reset(); } App.toMenu(); };
  },
};

function fit() {
  const tch = document.documentElement.classList.contains("touch") && App.screen === "play" ? 170 : 0;
  const aw = innerWidth - 12, ah = innerHeight - 12 - tch, sc = Math.min(aw / W, ah / H, 2.2), dpr = Math.min(2, devicePixelRatio || 1);
  cv.style.width = Math.floor(W * sc) + "px"; cv.style.height = Math.floor(H * sc) + "px";
  cv.width = Math.floor(W * sc * dpr); cv.height = Math.floor(H * sc * dpr);
  ctx.setTransform(sc * dpr, 0, 0, sc * dpr, 0, 0);
  document.getElementById("touch").style.display = tch ? "block" : "none";
}
addEventListener("resize", fit);

const STEP = 1 / 60;
let last = performance.now(), acc = 0, fitMode = "";
function frame(now) {
  const dt = Math.min(0.1, (now - last) / 1000); last = now;
  const mode = (App.screen === "play") + document.documentElement.className; if (mode !== fitMode) { fitMode = mode; fit(); }
  const g = App.screen === "play" ? App.game : App.demo;
  if (App.screen === "play" && g) {
    if (App.mode === "client") Online.clientFrame(dt);
    else if (!App.paused) {
      const pl = pads(), inputs = [inputFor(0, pl), App.mode === "local" ? inputFor(1, pl) : App.mode === "host" ? Online.netIn : null];
      acc += dt; while (acc >= STEP) { g.step(STEP, inputs); acc -= STEP; }
      for (const e of g.ev.splice(0)) Sfx.play(e);
      if (App.mode === "host" && now - Online.snapAt > 50) { Online.snapAt = now; Online.snap(g); }
    }
    if (g.over && !App.overShown && g.overT > 1.6) { App.overShown = true; if (g.winner >= 0) App.tally[g.winner]++; pauseBtn.hidden = true; UI.over(g); }
  } else {
    if (!App.demo || App.demo.over && App.demo.overT > 3) { App.demo = new Game({ size: "small", time: 300 }); App.demo.ai = [new AI(App.demo, 0, "hard"), new AI(App.demo, 1, "normal")]; }
    App.demo.step(dt, []); App.demo.ev.length = 0; App.demo.netEv.length = 0;
  }
  if (g || App.demo) render(ctx, g || App.demo, App.screen === "play" ? App.views : [0, 1]);
  requestAnimationFrame(frame);
}
window.DD = { App, Game, AI, Online, genWorld };
UI.menu(); fit(); requestAnimationFrame(frame);
if (qs.get("room")) UI.online();
</script>
</body>
