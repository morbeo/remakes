<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Remakes</title>
<style>
  body { margin: 0; padding: 32px 16px; font-family: system-ui, sans-serif; background: #f7f7f5; color: #222; }
  main { max-width: 900px; margin: 0 auto; }
  h1 { margin: 0 0 4px; }
  p { color: #555; margin: 0 0 24px; }
  .games { display: grid; grid-template-columns: repeat(auto-fill, minmax(260px, 1fr)); gap: 16px; }
  a { display: block; background: #fff; border: 1px solid #ddd; border-radius: 8px; overflow: hidden; color: inherit; text-decoration: none; }
  a:hover { border-color: #888; }
  a img { display: block; width: 100%; height: auto; aspect-ratio: 16 / 9; object-fit: cover; background: #eceae4; border-bottom: 1px solid #ddd; }
  a div { padding: 12px 16px 14px; }
  a strong { display: block; font-size: 1.1em; }
  a span { color: #666; font-size: .9em; }
</style>
</head>
<body>
<main>
  <h1>Remakes</h1>
  <p>Old games, rebuilt to run in the browser.</p>
  <div class="games">
    <a href="elasto-mania/"><img src="elasto-mania/screenshot.webp" alt="Spring Rider gameplay" width="640" height="400" loading="lazy"><div><strong>Spring Rider</strong><span>Elasto Mania remake</span></div></a>
    <a href="clockwerx/"><img src="clockwerx/screenshot.webp" alt="ClockWerx gameplay" width="640" height="348" loading="lazy"><div><strong>ClockWerx</strong><span>ClockWerx remake</span></div></a>
    <a href="excitebike/"><img src="excitebike/screenshot.webp" alt="Heatline MX gameplay" width="640" height="267" loading="lazy"><div><strong>Heatline MX</strong><span>Excitebike remake</span></div></a>
    <a href="arctic-adventure/"><img src="arctic-adventure/screenshot.webp" alt="Polar Delve gameplay" width="640" height="383" loading="lazy"><div><strong>Polar Delve</strong><span>Arctic Adventure remake</span></div></a>
  </div>
</main>
</body>
</html>
